<!DOCTYPE html>
<html lang="zh-Hant">
<!--
  宙返りロードスター 3D — a faithful Three.js rendition of tsuyatt.com's
  "Wall Flip" physics (reverse-engineered, parameters matched 1:1) with a
  rebuilt 3D night scene. The simulation, camera fit and scoring are exact
  ports of the published game module.

  NOTE: this file must be served over HTTP because it uses an ES module
  import, e.g. from the wall-flip directory:
      python3 -m http.server 8931
  then open http://localhost:8931/index-3d.html
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#06080d">
<title></title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏎️</text></svg>">
<style>
  :root {
    --ink: #eef4fa; --dim: #9fb6c9; --accent: #6ff0d0; --cyan: #5ac8ff;
    --gold: #ffd166; --red: #ff5c5c;
    --panel: rgba(10, 15, 24, .62); --line: rgba(140, 170, 200, .16);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #06080d; color: var(--ink);
    font-family: system-ui, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* projected world-space pop words */
  #pops { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 6; }
  .pop { position: absolute; transform: translate(-50%, -50%); font-weight: 900; font-size: 22px; white-space: nowrap;
    color: var(--c, #fff); text-shadow: 0 2px 10px rgba(0, 0, 0, .8), 0 0 16px var(--c, #fff);
    animation: popfly .9s ease-out forwards; }
  .pop.big { font-size: 32px; }
  @keyframes popfly {
    0% { opacity: 0; margin-top: 8px; } 12% { opacity: 1; }
    100% { opacity: 0; margin-top: -52px; }
  }

  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 7; }

  /* HUD (z above the result card so the mute button stays tappable) */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #hud[hidden] { display: none; }
  .hudtop { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 8px;
    align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 6px 12px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .panel label { display: block; font-size: 10px; letter-spacing: .14em; color: var(--dim); margin-bottom: 2px; }
  .panel b { font: 800 17px/1.1 ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
  .hgroup { display: flex; gap: 8px; }
  .hcol { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  .hrow { display: flex; gap: 6px; justify-content: flex-end; }
  #airmeter { width: 120px; height: 7px; border-radius: 4px; background: rgba(255, 255, 255, .12); overflow: hidden; margin: 4px 0 3px; }
  #airmeter i { display: block; height: 100%; width: 100%; border-radius: 4px; background: var(--cyan);
    transform-origin: left center; transition: transform .12s linear; }
  #airmeter.low i { background: var(--red); animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .45; } }
  #best { font: 700 12px/1 ui-monospace, monospace; color: var(--gold); text-align: right; padding: 2px 2px; }
  #mutebtn, #langbtn, #apibtn { pointer-events: auto; cursor: pointer; background: var(--panel); border: 1px solid var(--line);
    color: var(--dim); border-radius: 8px; padding: 4px 9px; font-size: 13px; }
  #hint { position: absolute; top: 74px; left: 50%; transform: translateX(-50%); font-weight: 800; font-size: 16px;
    text-shadow: 0 2px 8px rgba(0, 0, 0, .8); white-space: nowrap; }
  #hint.warn { color: var(--gold); } #hint.bad { color: var(--red); }
  #hint.info { color: var(--cyan); } #hint.good { color: var(--accent); }
  #achMsg { position: fixed; top: 74px; left: 50%; transform: translateX(-50%); z-index: 11; pointer-events: none;
    font-weight: 800; font-size: 15px; color: var(--gold); text-shadow: 0 2px 8px rgba(0, 0, 0, .8); white-space: nowrap; }
  #achMsg[hidden] { display: none; }

  /* start screen */
  #start { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 18px; overflow-y: auto; cursor: pointer;
    background: radial-gradient(130% 100% at 50% 0%, rgba(10, 20, 34, .25), rgba(4, 6, 12, .88)); }
  #start[hidden] { display: none; }
  #start h1 { margin: 0; font-size: clamp(26px, 6vw, 44px); font-weight: 900; color: var(--gold);
    text-shadow: 0 3px 18px rgba(0, 0, 0, .8); letter-spacing: .02em; }
  #start .sub { margin: 6px 0 18px; font-weight: 700; font-size: clamp(12px, 2.6vw, 16px); color: var(--ink); }
  #start ol { list-style: none; margin: 0 0 14px; padding: 0; max-width: 620px; text-align: left; }
  #start ol li { margin: 9px 0; }
  #start ol b { display: block; font-size: clamp(13px, 2.8vw, 16px); color: var(--gold); }
  #start ol span { font-size: clamp(11px, 2.4vw, 13px); color: #cfe3f5; }
  #start .hintbox { margin: 0 0 18px; padding: 7px 14px; border: 1px solid var(--line); border-radius: 999px;
    background: rgba(10, 15, 24, .55); font-size: 12px; color: var(--dim); }
  #startBtn { pointer-events: auto; cursor: pointer; border: 1px solid rgba(111, 240, 208, .55); border-radius: 999px;
    background: rgba(17, 34, 32, .8); color: var(--accent); font: 900 clamp(15px, 3.4vw, 20px) system-ui, sans-serif;
    padding: 12px 34px; animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  #startBest { margin: 12px 0 0; font: 800 14px ui-monospace, monospace; color: var(--gold); }
  #achBox { margin: 0 0 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #achCount { margin: 0; font: 800 12px system-ui, sans-serif; letter-spacing: .14em; color: var(--dim); }
  #achRow { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 620px; }
  .achPill { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: rgba(255, 255, 255, .04); color: rgba(207, 227, 245, .35); }
  .achPill.on { color: var(--gold); border-color: rgba(255, 209, 102, .55); background: rgba(255, 209, 102, .12); }
  #dailyBtn { pointer-events: auto; cursor: pointer; margin: 0 0 6px; padding: 7px 18px; border-radius: 999px;
    border: 1px solid var(--line); background: rgba(10, 15, 24, .55); color: var(--dim);
    font: 700 13px system-ui, "Noto Sans TC", sans-serif; }
  #dailyBtn.on { color: var(--accent); border-color: rgba(111, 240, 208, .55); background: rgba(17, 34, 32, .8); }
  #dailyInfo { margin: 0 0 14px; font: 800 12px ui-monospace, Menlo, monospace; color: var(--gold); }

  /* result panel (bottom-anchored; the camera fit reads its top edge) */
  #resultWrap { position: fixed; inset: 0; z-index: 9; display: flex; align-items: flex-end;
    justify-content: center; pointer-events: auto; }
  #resultWrap[hidden] { display: none; }
  #result { width: min(92vw, 560px); margin-bottom: 16px; background: rgba(13, 18, 30, .93);
    border: 1px solid rgba(111, 240, 208, .35); border-radius: 14px; padding: 14px 20px 12px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    animation: rise .45s cubic-bezier(.2, .9, .3, 1.2); }
  @keyframes rise { from { transform: translateY(60px); opacity: 0; } }
  #resTitle { margin: 0; font-size: 26px; font-weight: 900; text-align: center; }
  #resTitle.win { color: var(--accent); } #resTitle.lose { color: #8b93a3; }
  #resReason { margin: 4px 0 8px; text-align: center; font-size: 13px; color: var(--dim); }
  #resRank { text-align: center; font-size: 26px; font-weight: 900; margin: 2px 0 6px; }
  #resRows { margin: 0 0 6px; }
  #resRows div { display: flex; justify-content: space-between; font-size: 14px; padding: 2px 0; }
  #resRows dt { color: var(--dim); } #resRows dd { margin: 0; font: 800 14px ui-monospace, monospace; }
  #resTotal { text-align: center; font: 900 24px ui-monospace, monospace; margin: 4px 0 2px; }
  #resBest { text-align: center; font-size: 13px; font-weight: 700; color: var(--dim); margin: 2px 0 8px; }
  #resBest.newbest { color: var(--gold); }
  #resTime { text-align: center; font-size: 13px; font-weight: 700; color: var(--dim); margin: 0 0 8px; }
  #resTime.rec { color: var(--gold); }
  #resBtns { display: flex; gap: 8px; justify-content: center; }
  #retryBtn, #shareBtn, #resBoardBtn { display: block; margin: 0; cursor: pointer; border: 1px solid var(--line); border-radius: 999px;
    background: rgba(23, 32, 48, .9); color: var(--ink); font: 800 14px system-ui, sans-serif; padding: 9px 26px; }
  #shareBtn[hidden] { display: none; }

  /* touch pad */
  #pad { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; display: none; gap: 8px;
    padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); }
  #pad.show { display: flex; }
  #pad button { flex: 1; pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none;
    cursor: pointer; border: 1px solid var(--line); border-radius: 14px; color: #fff; padding: 10px 4px 8px;
    background: rgba(24, 32, 46, .72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    font: 800 15px system-ui, "Noto Sans TC", sans-serif; }
  #pad button small { display: block; font-size: 10px; font-weight: 600; opacity: .65; margin-top: 2px; }
  #pad button.on { outline: 2px solid #fff; }
  #pad button[data-act="drive"] { background: rgba(18, 66, 44, .8); }
  #pad button[data-act="suck"] { color: var(--accent); }
  #pad button.wait { opacity: .4; }

  #credit { position: fixed; left: 10px; bottom: 8px; z-index: 4; pointer-events: none;
    font-size: 10px; color: rgba(159, 182, 201, .55); }
  @media (pointer: coarse) { #credit { bottom: auto; top: 44px; left: 12px; } }
  /* start-screen online leaderboard button (styled like #dailyBtn) */
  #boardBtn { pointer-events: auto; cursor: pointer; margin: 0 0 6px; padding: 7px 18px; border-radius: 999px;
    border: 1px solid rgba(111, 240, 208, .45); background: rgba(10, 15, 24, .55); color: var(--accent);
    font: 700 13px system-ui, "Noto Sans TC", sans-serif; }
  /* online leaderboard DOM panels (2D build's #apiPanel styling; hidden by default) */
  .wf-panel { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center;
    background: rgba(4, 6, 12, .62); }
  .wf-panel.on { display: flex; }
  .wf-card { position: relative; width: min(86vw, 430px); box-sizing: border-box; background: #0d121e;
    border: 2px solid rgba(111, 240, 208, .35); border-radius: 12px; padding: 18px 20px 16px; color: #eef4fa;
    font: 500 14px/1.5 system-ui, "Noto Sans TC", sans-serif; box-shadow: 0 12px 40px rgba(0, 0, 0, .5); }
  .wf-card h3 { margin: 0 0 10px; font-size: 16px; font-weight: 800; color: #6ff0d0; }
  .wf-card input { width: 100%; box-sizing: border-box; background: #06080d; border: 1px solid #2a3342; border-radius: 8px;
    padding: 10px 12px; color: #eef4fa; font: 500 14px ui-monospace, Menlo, monospace; outline: none; }
  .wf-card input:focus { border-color: #6ff0d0; }
  .wf-card input.bad { border-color: #ff5c5c; }
  .wf-hint { margin: 8px 0 0; font-size: 12px; color: #8fa3b8; }
  .wf-row { display: flex; gap: 10px; margin-top: 14px; }
  .wf-btn { flex: 1; padding: 10px 0; border-radius: 999px; border: 1px solid rgba(159, 182, 201, .45);
    background: transparent; color: #cfe3f5; font: 700 14px system-ui, "Noto Sans TC", sans-serif; cursor: pointer; }
  .wf-btn.primary { background: #1f9d61; border-color: #1f9d61; color: #fff; }
  .wf-btn:hover { filter: brightness(1.15); }
  #boardGear { position: absolute; top: 12px; right: 12px; cursor: pointer; background: transparent; border: 0;
    color: #8fa3b8; font: 700 18px system-ui, sans-serif; padding: 2px 6px; }
  #boardGear:hover { color: #cfe3f5; }
  .wf-tr { display: grid; grid-template-columns: 2.4em minmax(0, 1fr) 4.6em 3.6em 4.6em; gap: 8px; align-items: baseline;
    padding: 3px 6px; font: 700 13px ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
  .wf-tr.head { font: 600 11px system-ui, "Noto Sans TC", sans-serif; color: #8fa3b8; padding-bottom: 5px; }
  .wf-tr .num { text-align: right; }
  .wf-tr .nm { font: 700 13px system-ui, "Noto Sans TC", sans-serif; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wf-tr.hl { background: rgba(255, 209, 102, .13); border-radius: 6px; }
  .wf-tr.hl span { color: #ffd166; }
  .wf-empty { margin: 18px 0 10px; text-align: center; font: 600 14px system-ui, "Noto Sans TC", sans-serif; color: #8fa3b8; }
</style>
</head>
<body>
  <a href="../../" id="backlink" style="position:fixed;top:3px;left:12px;z-index:30;color:#8fa3b8;text-decoration:none;font:600 11px system-ui,sans-serif;letter-spacing:.05em;"></a>
<div id="stage"></div>
<div id="flash"></div>
<div id="pops"></div>

<div id="hud" hidden>
  <div class="hudtop">
    <div class="hgroup">
      <div class="panel">
        <label id="lblAir"></label>
        <div id="airmeter"><i></i></div>
        <b id="airText">100</b>
      </div>
      <div class="panel">
        <label id="lblSpeed"></label>
        <b id="speed">0 km/h</b>
      </div>
    </div>
    <div class="hgroup">
      <div class="panel"><label id="lblHeight"></label><b id="alt">0.0 m</b></div>
      <div class="panel"><label id="lblDist"></label><b id="dist">0 m</b></div>
    </div>
    <div class="hcol">
      <div class="panel"><label id="lblRolls"></label><b id="rolls">0</b></div>
      <div id="best"></div>
      <div class="hrow">
        <button id="langbtn"></button>
        <button id="apibtn" type="button"></button>
        <button id="mutebtn">🔊</button>
      </div>
    </div>
  </div>
  <div id="hint" hidden></div>
</div>
<div id="achMsg" hidden></div>

<div id="start">
  <h1 id="startTitle"></h1>
  <p class="sub" id="startSub"></p>
  <ol>
    <li><b id="s1a"></b><span id="s1b"></span></li>
    <li><b id="s2a"></b><span id="s2b"></span></li>
    <li><b id="s3a"></b><span id="s3b"></span></li>
    <li><b id="s4a"></b><span id="s4b"></span></li>
  </ol>
  <p class="hintbox" id="startHint"></p>
  <div id="achBox">
    <p id="achCount"></p>
    <div id="achRow"></div>
  </div>
  <button id="dailyBtn" type="button"></button>
  <p id="dailyInfo" hidden></p>
  <button id="boardBtn" type="button"></button>
  <button id="startBtn"></button>
  <p id="startBest" hidden></p>
</div>

<div id="resultWrap" hidden>
  <div id="result">
    <h2 id="resTitle"></h2>
    <p id="resReason"></p>
    <div id="resWin">
      <div id="resRank">GOOD!</div>
      <dl id="resRows">
        <div><dt><span id="lblRowRolls"></span> <span id="resRolls">0</span> <span id="unitRolls"></span></dt><dd id="resRollPts">+0</dd></div>
        <div><dt id="lblRowSoft"></dt><dd id="resSoft">0 / 30</dd></div>
        <div><dt id="lblRowLevel"></dt><dd id="resLevel">0 / 20</dd></div>
      </dl>
      <div id="resTotal">TOTAL <b>0</b> <span id="unitPts"></span></div>
      <p id="resTime" hidden></p>
    </div>
    <p id="resBest"></p>
    <div id="resBtns">
      <button id="shareBtn" type="button" hidden></button>
      <button id="resBoardBtn" type="button"></button>
      <button id="retryBtn"></button>
    </div>
  </div>
</div>

<div id="pad">
  <button data-act="suck"><span></span><small>X／↓</small></button>
  <button data-act="left"><span></span><small>←</small></button>
  <button data-act="right"><span></span><small>→</small></button>
  <button data-act="drive"><span></span><small>SPACE</small></button>
</div>

<div id="credit"></div>

<!-- online leaderboard DOM panels: ranking overlay + rank API settings + score name entry
     (board first so the settings/name panels stack above it) -->
<div id="boardPanel" class="wf-panel">
  <div class="wf-card">
    <button id="boardGear" type="button"></button>
    <h3 id="boardTitleEl"></h3>
    <div id="boardRows"></div>
    <p class="wf-hint" id="boardNoteEl" hidden></p>
    <p class="wf-hint" id="boardCloseEl"></p>
  </div>
</div>
<div id="apiPanel" class="wf-panel">
  <div class="wf-card">
    <h3 id="apiTitleEl"></h3>
    <input id="apiInput" type="url" spellcheck="false" autocomplete="off" autocapitalize="off">
    <p class="wf-hint" id="apiHintEl"></p>
    <div class="wf-row">
      <button id="apiSaveBtn" class="wf-btn primary" type="button"></button>
      <button id="apiCancelBtn" class="wf-btn" type="button"></button>
    </div>
  </div>
</div>
<div id="namePanel" class="wf-panel">
  <div class="wf-card">
    <h3 id="nameTitleEl"></h3>
    <input id="nameInput" maxlength="10" spellcheck="false" autocomplete="off" autocapitalize="off">
    <p class="wf-hint" id="nameHintEl"></p>
    <div class="wf-row">
      <button id="nameSendBtn" class="wf-btn primary" type="button"></button>
      <button id="nameSkipBtn" class="wf-btn" type="button"></button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from './vendor/three.module.js';

/* ============================================================
   宙返りロードスター 3D — exact port of the reverse-engineered
   simulation (constants / track / 4 modes / collision / scoring),
   the night 3D scene, and the fit-camera of the original module.
   ============================================================ */

// ---------- i18n (zh-Hant / en) ----------
const STR = {
  tc: {
    title: '牆上翻滾 WALL FLIP', sub: '開上反翹的牆、倒掛飛出、翻滾著地',

    hint: '吸附與推進器共用壓縮空氣 · M 靜音 · R 重來 · L 排行榜',
    start: '—— 按 SPACE 開始 ——', again: '—— 按 SPACE 再來一次 ——',
    footer: '參數逆向自 tsuyatt.com 宙返りロードスター · Three.js 3D 復刻',
    hudAir: '空氣 AIR', hudSpeed: '速度 SPEED', hudHeight: '高度 HEIGHT', hudDist: '距離 DIST', hudRolls: '翻滾 ROLLS', best: '最佳',
    suckOn: '◉ 吸附中',
    mLaunch: '起飛！單鍵翻滾、雙鍵減速', mPeel: '剝離墜落！', mStall: '失速了！滑回地面再衝一次', mNoAir: '空氣用盡！', mGrip: '沒按住吸附會剝離！', mSlip: 'SLIP',
    mLand: (s, l) => `著地！SOFT ${s}/30 · LEVEL ${l}/20`,
    mAch: (names) => `成就解鎖：${names}`,

    rFall: '從牆上剝離了。反翹段要一直按住吸附。', rWall: '撞上牆壁了。',
    rHard: (kmh) => `落地速度 ${kmh} km/h——要更早用雙鍵減速。`, rTilt: (deg) => `以傾斜 ${deg}° 的姿態觸地了。`,
    rowRolls: '翻滾 ROLLS', rowSoft: '柔軟 SOFT', rowLevel: '水準 LEVEL', pts: '點',
    newRecord: '★ 新紀錄！', bestLabel: '最佳',
    shareBtn: '📋 複製成績', copied: '已複製',
    shareText: (n, dist, s, l, total, rank, cn) => `牆上翻滾 Wall Flip（${cn}）：翻滾 ${n} 回 · 飛行 ${dist} m · SOFT ${s}/30 · LEVEL ${l}/20 → TOTAL ${total} 分 ${rank}！`,
    boardTitle: '排行榜', colRank: '名次', colScore: '總分', colRolls: '翻滾', colDate: '日期', boardEmpty: '暫無紀錄', boardClose: '—— 點擊或按 L / SPACE 關閉 ——',
    backLink: '← 返回總覽 Back',
    padStick: '吸附', padLeft: '左', padRight: '右', padGo: '油門',
    langBtn: 'EN',
    // extra keys for strings that only exist in this 3D build
    muteTitle: '靜音 (M)',
    popCrash: ['轟隆!!', '碰撞!!', '砰!!'], popPeel: ['剝離了!', '滑掉了!'], popSlip: ['打滑!', '空轉!'],

    s.x += s.vx * dt; s.y += s.vy * dt; s.z += s.vz * dt;
    s.roll += s.rw * dt; s.pitch += s.pw * dt;
    const cp = Math.abs(s.z) < ROAD_W / 2 + .5 ? closestOnTrack(s.x, s.y) : null;
    if (cp && cp.n < .7 && cp.n > -1.5) {
      s.x += cp.nx * (.7 - cp.n); s.y += cp.ny * (.7 - cp.n);
      const Hn = s.vx * cp.nx + s.vy * cp.ny;
      if (Hn < 0) { s.vx -= Hn * cp.nx * 1.2; s.vy -= Hn * cp.ny * 1.2; }
      s.vx *= 1 - dt * 2; s.vy *= 1 - dt * 2; s.rw *= 1 - dt * 3;
    }
    let low = Infinity;
    for (const pt of CAR.POINTS) low = Math.min(low, s.y + localToWorld(s.roll, s.pitch, pt[0], pt[1], pt[2], s.yaw)[1]);
    if (low < 0) {
      s.y -= low;
      if (s.vy < 0) s.vy = -s.vy * .3;
      s.vx *= .6; s.vz *= .6; s.rw *= .6; s.pw *= .6;
    }
    if (low < .05 && Math.abs(s.vy) < 1.5) {
      const k = Math.min(1, dt * 6);
      s.roll += (Math.round(s.roll / Math.PI) * Math.PI - s.roll) * k;
      s.pitch += (Math.round(s.pitch / Math.PI) * Math.PI - s.pitch) * k;
      s.rw *= 1 - k; s.pw *= 1 - k;
      s.vx *= 1 - Math.min(1, dt * 2); s.vz *= 1 - Math.min(1, dt * 2);
    }
    s.left = s.right = s.suck = s.drive = false;
  };
  const step = (dt, inp) => {
    s.time += dt;
    if (s.mode === 'road') stepRoad(dt, inp);
    else if (s.mode === 'air') stepAir(dt, inp);
    else if (s.mode === 'landed') stepLanded(dt);
    else stepCrash(dt);
  };
  const advance = (dt, inp) => {
    for (s.acc += dt; s.acc >= I.STEP;) { s.acc -= I.STEP; step(I.STEP, inp); }
  };
  snap();
  return { state: s, step, advance };
}

// ---------- scoring (exact port of se) ----------
function scoreOf(land) {
  const c = v => Math.max(0, Math.min(1, v));
  const roll = 50 * land.rolls;
  const soft = 30 * c(1 - land.fall / BASE.LAND_SPEED);
  const level = 20 * c(1 - land.tilt / BASE.LAND_TILT);
  return { roll, soft, level, total: Math.round(roll + soft + level) };
}

// ---------- particle systems (port of the original ge factory) ----------
function makeParticles(count, blending, opacity) {
  const mesh = new THREE.InstancedMesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, opacity, blending, depthWrite: false }),
    count);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  mesh.setColorAt(0, new THREE.Color());
  mesh.frustumCulled = false;
  mesh.renderOrder = blending === THREE.AdditiveBlending ? 3 : 2;
  scene.add(mesh);
  const list = [];
  const cA = new THREE.Color(), cB = new THREE.Color(), m4 = new THREE.Matrix4(), pv = new THREE.Vector3(), sv = new THREE.Vector3();
  return {
    spawn(opts) {
      if (list.length >= count) list.shift();
      list.push({ vx: 0, vy: 0, vz: 0, g: 0, drag: 1, grow: 1, age: 0, color: 16777215, end: BG, ...opts });
    },
    clear() { list.length = 0; },
    update(dt) {
      let n = 0;
      for (const p of list) {
        p.age += dt;
        if (p.age >= p.life) continue;
        const X = Math.exp(-p.drag * dt);
        p.vx *= X; p.vy = p.vy * X - p.g * dt; p.vz *= X;
        p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
        if (p.y < .1 && p.vy < 0) { p.y = .1; p.vy = 0; }
        list[n++] = p;
      }
      list.length = n;
      for (let i = 0; i < n; i++) {
        const p = list[i], ct = p.age / p.life;
        m4.compose(pv.set(p.x, p.y, p.z), camera.quaternion, sv.setScalar(p.size * (1 + (p.grow - 1) * ct)));
        mesh.setMatrixAt(i, m4);
        cA.set(p.color).lerp(cB.set(p.end), ct);
        if (blending === THREE.AdditiveBlending) cA.multiplyScalar(1 - ct);
        mesh.setColorAt(i, cA);
      }
      mesh.count = n;
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    },

// ---------- online leaderboard (rank API client, ported from the 2D build) ----------
// Base URL is configured at runtime (gear buttons) and persisted in localStorage
// `wallflip3.api`; empty = online ranking off. Bot/demo runs never submit.
const LOG_CAP = 12000;                 // max input-log pairs (matches server cap)
let inputLog = [];                     // [framesSincePrevChange, inputMask] pairs
let inputLogFrames = 0;
let inputLogLast = -1;
let lastSubmit = null;                 // { n, s } of the entry just submitted
let onlineBoard = null;                // fetched online top-10 (null = none/failed)
let onlinePending = false;             // online fetch in flight
let onlineHi = -1;                     // highlighted index in the online list
let boardOn = false;                   // ranking overlay open
function apiBase() {
  try {
    const s = (localStorage.getItem('wallflip3.api') || '').trim();
    return /^https?:\/\//i.test(s) ? s.replace(/\/+$/, '') : '';
  } catch (e) { return ''; }
}
function submitThrottled() {
  try { return Date.now() - (+localStorage.getItem('wallflip3.subT') || 0) < 60000; }
  catch (e) { return false; }
}
// per-physics-frame input recording: only CHANGES are logged, each with the
// frame count since the previous change (the original's re() scheme); physics
// is deterministic at 240 Hz, so the server can replay a run from this log
function logInputFrame(inp) {
  inputLogFrames++;
  const mask = (inp.suck ? 1 : 0) | (inp.drive ? 2 : 0) | (inp.left ? 4 : 0) | (inp.right ? 8 : 0);
  if (mask !== inputLogLast) {
    if (inputLog.length < LOG_CAP) inputLog.push([inputLogFrames, mask]);
    inputLogFrames = 0;
    inputLogLast = mask;
  }
}
// GET {base}/top?c=0; accepts a raw array or { board: [...] }; on failure the
// overlay shows the empty state plus an offline note
function fetchOnlineBoard(base) {
  onlinePending = true;
  fetch(base + '/top?c=0')
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(j => {
      const arr = Array.isArray(j) ? j : (j && Array.isArray(j.board)) ? j.board : null;
      if (!arr) throw new Error('unexpected payload');
      onlineBoard = arr
        .filter(e => e && typeof e.n === 'string' && Number.isFinite(e.s) && Number.isFinite(e.r))
        .slice(0, 10)
        .map(e => ({ n: e.n, s: e.s, r: e.r, t: Number.isFinite(e.t) ? e.t : 0 }));
      onlineHi = lastSubmit ? onlineBoard.findIndex(e => e.n === lastSubmit.n && e.s === lastSubmit.s) : -1;
      onlinePending = false;
      if (boardOn) renderBoard();
    })
    .catch(err => {
      onlinePending = false;
      onlineBoard = null;
      console.warn('rank fetch failed:', err);
      if (boardOn) renderBoard();
    });
}
// POST {n, s, r, c, t, log} — sanitized client-side, throttled to 1 per 60 s;
// bot/demo runs never reach this (guarded here and at the call site)
function submitScore(name) {
  const base = apiBase();
  if (!base || DEMO || submitThrottled()) return;
  const st = sim.state, sc = game.score;
  if (!sc || !st.land) return;
  const payload = {
    n: String(name).trim().slice(0, 10),
    s: clamp(Math.round(sc.total) || 0, 0, 5000),
    r: clamp(Math.round(st.land.rolls) || 0, 0, 99),
    c: 0,
    t: Math.round(game.runTime * 100) / 100,
    log: inputLog.slice(0, LOG_CAP),
  };
  try { localStorage.setItem('wallflip3.subT', String(Date.now())); } catch (e) {}
  lastSubmit = { n: payload.n, s: payload.s };
  fetch(base + '/submit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(j => {
      if (!j || j.ok !== true || !Number.isFinite(j.rank)) throw new Error('unexpected response');
      showNetMsg(t('submitOk') + ' #' + j.rank, false);
    })
    .catch(err => {
      lastSubmit = null;
      console.warn('submit failed:', err);
      showNetMsg(t('submitFail'), true);
    });
}

function processEvents() {
  const st = sim.state;
  for (const ev of st.events) {
    if (ev.type === 'launch' || ev.type === 'detach' || ev.type === 'lift') game.rolls = 0;
    if (ev.type === 'launch') {
      launchX = ev.x;
      popAt(ev.x, ev.y + 2.5, 0, pick(t('popLaunch')), 'hsl(200 90% 55%)');
      sfx.whoosh();
    } else if (ev.type === 'detach') {
      launchX = ev.x;
      popAt(ev.x - 1, ev.y + 1.5, 0, pick(t('popPeel')), 'hsl(0 85% 55%)');
      sfx.drop();
    } else if (ev.type === 'crash') {
      crashFx(ev.x, Math.max(ev.y, .3), st.z);
    } else if (ev.type === 'land') {
      landFx(ev, st);
    }
    if (ev.type === 'crash' || ev.type === 'land') { game.playing = false; game.endAt = DELAYS[st.mode]; }
  }
  st.events.length = 0;
  if (st.mode === 'air') {
    const r = rollsCount(st.roll, st.roll0);
    if (r > game.rolls) {
      game.rolls = r;
      popAt(st.x, st.y + 2.4, st.z, t('rollUnit', r), 'hsl(45 95% 50%)', true);
      sfx.chime(r);
    }
  }
}

      x: st.x - Math.sign(st.v) * 1.8, y: .15, z: rand(-.9, .9),
      vx: rand(-1.5, 1.5), vy: rand(.5, 2), vz: rand(-1, 1),
      drag: 1.8, life: rand(.5, .9), size: rand(.4, .9), grow: 2.4,
      color: 12567495, end: BG,
    });
  }
  // crash fire + smoke while tumbling
  if (st.mode === 'crash') {
    if (Math.random() < .8) fx.spawn({
      x: st.x + rand(-1, 1), y: st.y + rand(0, .6), z: st.z + rand(-.7, .7),
      vx: rand(-.5, .5), vy: rand(2, 4), drag: 1, life: rand(.4, .8),
      size: rand(.8, 1.6), grow: 1.6, color: 16751162, end: 8392704,
    });
    if (Math.random() < .5) smoke.spawn({
      x: st.x + rand(-1, 1), y: st.y + 1, z: st.z + rand(-.7, .7),
      vx: rand(-.5, .5), vy: rand(2, 3.5), drag: .6, life: rand(1.5, 2.5),
      size: 1.2, grow: 3, color: 3025448, end: BG,
    });
  }
  fx.update(dt);
  smoke.update(dt);
  // debris physics
  {
    let n = 0;
    for (const d of debris) {
      d.vy -= 9.8 * dt;
      d.x += d.vx * dt; d.y += d.vy * dt; d.z += d.vz * dt;
      d.rx += d.w * dt; d.ry += d.w * .7 * dt;
      if (d.y < .06) { d.y = .06; d.vy = Math.abs(d.vy) * .3; d.vx *= .6; d.vz *= .6; d.w *= .6; }
      dm4.compose(gt.set(d.x, d.y, d.z), dq.setFromEuler(de.set(d.rx, d.ry, 0)), done);
      debrisMesh.setMatrixAt(n++, dm4);
    }
    debrisMesh.count = n;
    debrisMesh.instanceMatrix.needsUpdate = true;
  }
  // shadow blob
  const h = Math.max(0, st.y - CAR.H);
  shadow.visible = !(st.mode === 'road' && st.u > .5) && h < 40;
  shadow.position.set(st.x, .08, st.z);
  shadow.material.opacity = .6 * clamp(1 - h / 22, .1, 1);
  shadow.scale.setScalar(1 + h * .04);
  // UFO easter egg
  ufo.group.position.set(st.x + Math.sin(tm * .35) * 55, 2e3 + Math.sin(tm * 1.3) * 1.5, -90);
  ufo.group.rotation.y += dt * .8;
  ufo.lights.forEach((m, i) => m.material.color.setHSL((tm * .6 + i / 12) % 1, 1, (Math.floor(tm * 4) + i) % 2 ? .65 : .4));
}

// ---------- fit camera (exact port of kn) ----------
const camDir = new THREE.Vector3(-.5, .16, 1).normalize();
const camState = { look: new THREE.Vector3(), dist: 30, init: false };
const NDC = { left: -.94, right: .94, top: .66, bottom: -.94 };
const fitPts = [];
const proj2 = new THREE.Vector3(), center = new THREE.Vector3();
const maxRideX = Math.max(...A.map(p => p.x));
function bottomBound() {
  if (screen !== 'result') return -.94;
  const top = el.result.getBoundingClientRect().top - stageEl.getBoundingClientRect().top;
  return Math.min(.4, 1 - 2 * (top - 12) / stageEl.clientHeight);
}
function camFits(dist) {
  camera.position.copy(camState.look).addScaledVector(camDir, dist);
  camera.lookAt(camState.look);
  camera.updateMatrixWorld();
  for (const p of fitPts) {
    proj2.copy(p).project(camera);
    if (proj2.x < NDC.left || proj2.x > NDC.right || proj2.y < NDC.bottom || proj2.y > NDC.top) return false;
  }
  return true;
}
function updateCamera(dt) {
  const st = sim.state;
  NDC.bottom = bottomBound();
  fitPts.length = 0;
  const add = (x, y, z = st.z) => fitPts.push(new THREE.Vector3(x, y, z));
  add(st.x - 3.2, st.y - 1.5);
  add(st.x + 3.2, st.y + 2);
  if (screen === 'result') {
    fitPts.length = 0;
    add(st.x - 3.4, Math.max(0, st.y - 1.2));
    add(st.x + 3.4, st.y + 1.6);
  } else if (st.mode === 'road') {
    add(track.top.x - 2, track.top.y + 2.5, 0);
    add(Math.min(st.x - 3, -4), 0, 0);
    add(maxRideX + 1, 0, 0);
  } else if (st.mode === 'crash') {
    add(st.x - 6, 0);
    add(st.x + 6, st.y + 4);
  } else if (st.y < 45) {
    add(st.x - 3, 0);
    add(st.x + 3, 0);
  } else {
    add(st.x - 5, st.y - 7);
    add(st.x + 5, st.y + 4);
  }
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity, z0 = Infinity, z1 = -Infinity;
  for (const p of fitPts) {
    x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x);
    y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y);
    z0 = Math.min(z0, p.z); z1 = Math.max(z1, p.z);
  }
  center.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  const k = camState.init ? Math.min(1, dt * 2.5) : 1;
  camState.look.lerp(center, k);
  let lo = 4, hi = 200;
  for (let i = 0; i < 16; i++) {
    const mid = (lo + hi) / 2;
    if (camFits(mid)) hi = mid; else lo = mid;
  }
  camState.dist += (hi - camState.dist) * k;
  camFits(camState.dist);
  camState.init = true;
}

// ---------- HUD ----------
const padBtnEls = {};
for (const btn of el.pad.querySelectorAll('button')) padBtnEls[btn.dataset.act] = btn;
function updateHud() {
  const st = sim.state;
  const airMode = st.mode === 'air';
  for (const [act, btn] of Object.entries(padBtnEls)) {
    btn.classList.toggle('on', game.playing && (keyActive(act) || padActive(act)));
    if (act === 'suck' || act === 'drive') btn.classList.toggle('wait', game.playing && airMode);
  }
  setMeter(st.air, 100);
  const spd = st.mode === 'road' ? Math.abs(st.v) : Math.hypot(st.vx, st.vy, st.vz);
  el.speed.textContent = `${Math.round(spd * 3.6)} km/h`;
  const h = Math.max(0, st.y - CAR.H);
  el.alt.textContent = (h < 100 ? h.toFixed(1) : Math.round(h)) + ' m';
  el.dist.textContent = Math.round(Math.hypot(st.x - startX, st.z)) + ' m';
  el.rolls.textContent = game.rolls;
  // contextual hint (original conditions)
  let hint = null;
  const onArc = st.mode === 'road' && st.u > 0 ? trackAt(st.u) : null;
  const level = Math.cos(st.roll) * Math.cos(st.pitch);
  if (game.playing) {
    if (st.air <= 0 && (airMode || onArc)) hint = [t('mNoAir'), 'bad'];
    else if (onArc && onArc.phi > 1.2 && st.gripLeft < .35 && !st.suck) hint = [t('mGrip'), 'warn'];
    else if (airMode && st.launched && level < -.5 && Math.abs(st.rw) < .6 && st.airTime > .25) hint = [t('hintRoll'), 'info'];
    else if (airMode && level > .85 && st.vy < -5 && !(st.left && st.right)) hint = [t('hintBrake'), 'good'];
  }
  if (hint) {
    el.hint.hidden = false;
    el.hint.textContent = hint[0];
    el.hint.className = hint[1];
  } else el.hint.hidden = true;
}

// ---------- resize ----------
function resize() {
  const w = stageEl.clientWidth, h = stageEl.clientHeight;
  if (!w || !h) return;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h, false);
  const padH = Math.min(padShown ? el.pad.offsetHeight : 0, h / 2);
  camera.aspect = w / (h + padH);
  if (padH) camera.setViewOffset(w, h + padH, 0, padH, w, h);
  else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stageEl);
new ResizeObserver(resize).observe(el.pad);
addEventListener('resize', resize);

// ---------- main loop ----------
sim = createSim({ onAir: onAirHook }, dailyConsts());
startX = sim.state.x;
updatePadVisibility();
resize();
updateAllText();
if (DEMO) resetRun();
let last = 0;
renderer.setAnimationLoop(now => {
  const dt = last ? Math.min((now - last) / 1000, .1) : 0;
  last = now;
  const t = now / 1000;
  const st = sim.state;
  if (game.playing || st.mode === 'landed' || st.mode === 'crash') {
    const human = {
      suck: held('suck'), drive: held('drive'), left: held('left'), right: held('right'),
    };
    for (game.acc += dt * TIME_SCALE; game.acc >= BASE.STEP;) {
      game.acc -= BASE.STEP;
      const inp = DEMO ? botInputs() : human;
      sim.step(BASE.STEP, inp);
      if (screen === null) logInputFrame(inp); // input bitmask log (replay verification)
    }
  }
  processEvents();
  if (game.endAt !== Infinity) {
    game.endAt -= dt;
    if (game.endAt <= 0) showResult();
  }
  updateHud();
  updateCar(dt, t);
  updateCamera(dt);
  stars.position.copy(camera.position);
  if (game.shake > 0) {
    game.shake = Math.max(0, game.shake - dt * 1.6);
    camera.position.x += rand(-1, 1) * game.shake * .5;
    camera.position.y += rand(-1, 1) * game.shake * .5;
  }
  audioFrame();
  if (DEMO && screen === 'result') {
    retryT += dt;
    if (retryT > 2.5) { retryT = 0; resetRun(); }
  } else retryT = 0;
  renderer.render(scene, camera);
});
</script>
