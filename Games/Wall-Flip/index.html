(() => {
'use strict';

/* ============================================================
   宙返りロードスター 2D — a faithful 2D port of tsuyatt.com's
   "Wall Flip / 宙返りロードスター" physics, reverse-engineered
   from its published game module (parameters matched 1:1).
   Drive up the road-wall (two courses), stick through the overhang,
   launch inverted, roll with side thrusters, land on the tires.
   ============================================================ */

// ---------- utils ----------
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const DEG = Math.PI / 180;
const cos = Math.cos, sin = Math.sin;
const rand = (a, b) => a + Math.random() * (b - a);

// ---------- bilingual strings (TC default, EN toggle; persisted) ----------
const STR = {

  },
  en: {

    start: '—— PRESS SPACE TO START ——', again: '—— PRESS SPACE TO RETRY ——',
    tapStart: '—— TAP TO START ——', tapAgain: '—— TAP TO RETRY ——',
    footer: 'Physics reverse-engineered from tsuyatt.com 宙返りロードスター · 2D tribute',
    course: 'COURSE', arc: 'arc', radius: 'radius', straight: 'straight',
    hudAir: 'AIR', hudSpeed: 'SPEED', hudHeight: 'HEIGHT', hudDist: 'DIST', hudRolls: 'ROLLS', best: 'BEST',
    statH: 'HEIGHT', statD: 'DIST', statA: 'AIR',
    suckOn: '◉ STICKING',
    mLaunch: 'Airborne! ←/→ to roll, both to brake', mPeel: 'Peeled off!', mStall: 'Stalled! Slide back down and retry', mNoAir: 'Out of air!', mGrip: 'Hold Stick or you peel off!',
    mLand: (s, l) => `Landed! SOFT ${s}/30 · LEVEL ${l}/20`,
    mAch: (n) => `Achievement unlocked: ${n}`, achJoin: ', ', mCopied: 'Result copied to clipboard!',
    win: 'NAILED IT!!', lose: 'CRASHED…',
    rFall: 'You peeled off the wall. Keep holding Stick on the overhang.', rWall: 'You hit the wall.',
    rHard: (k) => `You hit the ground at ${k} km/h. Brake earlier with both thrusters.`, rTilt: (d) => `You touched down tilted ${d}°.`,
    rowRolls: (n) => `${n} rolls`, rowSoft: 'SOFT', rowLevel: 'LEVEL', pts: 'pts',
    subWin: (n, d, t2, rec) => `${n} roll(s) · ${d} m flight · time ${t2} s${rec ? ' ★BEST' : ''}`,
    newRecord: '★ NEW RECORD!', bestLabel: 'BEST',
    shareBtn: 'COPY RESULT',
    shareText: (r, d, s, l, tt, rank, cn) => `Wall Flip (${cn}): ${r} roll(s), ${d} m flight, SOFT ${s}/30 · LEVEL ${l}/20 → TOTAL ${tt} pts ${rank}!`,
    boardTitle: (cn) => `LEADERBOARD · ${cn}`, colRank: '#', colScore: 'SCORE', colRolls: 'ROLLS', colDate: 'DATE', boardEmpty: 'No records yet', boardClose: '—— Click or press L / SPACE to close ——',
    boardBtn: 'RANKING', langBtn: '中文',
    ghostBtn: 'GHOST', ghostOn: 'ON', ghostOff: 'OFF', ghostSaved: 'Ghost updated!', ghostLabel: 'GHOST',
    padStick: 'STICK', padLeft: '←', padRight: '→', padGo: 'GO',
    ach_land: 'First Land', ach_roll1: 'First Flip', ach_roll2: 'Double', ach_roll3: 'Triple', ach_soft30: 'Butter', ach_legend: 'Legend', ach_far100: '100m+', ach_eco: 'Eco',
    // online leaderboard
    tabOnline: 'ONLINE', tabLocal: 'LOCAL', onlineMark: 'ONLINE',
    submit: 'Submit', skip: 'Skip', submitTitle: 'Submit your score',
    nameLabel: 'Your name (max 10)',
    submitOk: 'Uploaded', submitFail: 'Submit failed',
    apiBtn: '⚙', apiTitle: 'Rank API', apiSave: 'Save', apiCancel: 'Cancel',
    apiPlaceholder: 'https://your-rank-api.example.com',
    apiHint: 'Paste your rank API URL; empty = local ranking only',
    apiSaved: 'Saved', colTime: 'TIME',
  },
};
let lang = 'tc';
try {
  const saved = localStorage.getItem('wallflip2.lang');
  if (saved === 'en' || saved === 'tc') lang = saved;
  else if ((navigator.language || '').startsWith('en')) lang = 'en';
} catch (e) {}
const t = (k, ...a) => {
  const v = (STR[lang] && STR[lang][k]) ?? STR.tc[k];
  return typeof v === 'function' ? v(...a) : v;
};
function setLang(l) {
  lang = l;
  try { localStorage.setItem('wallflip2.lang', l); } catch (e) {}
  try { sfx.click(); } catch (e) {}
}
const courseName = c => (lang === 'en' && c.nameEn) ? c.nameEn : c.name;

// ---------- canvas ----------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let DPR = 1;
const W = () => canvas.width / DPR, H = () => canvas.height / DPR;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.floor(innerWidth * DPR); canvas.height = Math.floor(innerHeight * DPR);
  canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px';
  layoutBtns();
}

// Night instrument. Framed-sheet (light analytics) was redrawn: this screen is
// driven at night, and a white sheet would cover the road. Kept from that
// sheet: one chrome band, IBM Plex Mono figures at 400, labels at 600, and
// one 2px ink underline on the selected course. Mint is only the air
// reservoir. Amber is only a record.
const SANS = '"IBM Plex Sans", "Noto Sans TC", system-ui, sans-serif';
const MONO = '"IBM Plex Mono", ui-monospace, Menlo, monospace';
const UI = {
  text: '#e8edf4',
  muted: '#9aa6b5',
  faint: '#7e8b9c',
  line: '#2c3442',
  sheet: '#121820',
  chrome: 'rgba(8,11,18,.94)',
  accent: '#6ff0d0',
  record: '#e2b340',
  danger: '#e5566f',
  warn: '#ff8c5a',
};
try {
  for (const spec of ['400 16px "IBM Plex Sans"', '500 16px "IBM Plex Sans"', '600 16px "IBM Plex Sans"', '400 18px "IBM Plex Mono"', '500 14px "IBM Plex Mono"', '600 12px "IBM Plex Mono"']) {
    document.fonts.load(spec).catch(() => {});
  }
} catch (e) {}

// ---------- tuning: exact constants from the original module ----------
const G = 9.8;
const STEP = 1 / 240;
const RUNUP = 16;          // flat approach length behind the track start
const VMAX = 90;           // m/s
const MOTOR_A = 30;        // engine accel cap
const MOTOR_P = 1200;      // engine power (a = MOTOR_P / v)
const MU = 3.1;            // tire friction coefficient
const SUCK = 1.4 * G;      // stick suction accel
const ROLL_RES = 0.25;     // rolling resistance
const DRAG = 0.003;        // quadratic drag
const THRUST = 1.5 * G;    // per thruster accel
const ANG = 16;            // spin accel rad/s^2
const ROLL_DAMP = 7;       // spin damping when 0 or 2 jets fire
const SPIN_DAMP = 0.8;     // spin damping with a single jet
const LEVEL_T = 2, LEVEL_CLEAR = 3;
const AIR_G = 1.25;        // air gravity multiplier
const AIR_SUCK = 8;        // air/s while sucking
const AIR_JET = 5;         // air/s per thruster
const COAST = 20;          // engine braking when throttle released
const CREEP = 5;           // rollback speed cap on the arc
const WALL_CRASH = 9;      // impact into structure that destroys the car
const GRACE = 0.15;        // no structure collision right after launch
const LAND_TILT = 25 * DEG;
const LAND_SPEED = 5;      // max impact speed (m/s) at the contact point
const LAND_SPIN = 2.5;     // max spin rate at touchdown
const AIR_MAX = 100;
const CAR = { LEN: 4.4, H: 0.66, WHEEL_X: 1.38, WHEEL_R: 0.36 };
// 2D collision/silhouette points (x, y) local, wheel flag
const POINTS = [
  [CAR.WHEEL_X, -CAR.H, 1], [CAR.WHEEL_X + .12, -CAR.H, 1],
  [-CAR.WHEEL_X, -CAR.H, 1], [-CAR.WHEEL_X - .12, -CAR.H, 1],
  [2.2, -.36, 0], [-2.2, -.36, 0],
  [.2, -.1, 0], [-.5, .55, 0],
];
// courses: A 宙返り = the original wall; B 長空 = taller/longer (more airtime, more rolls)
const COURSES = [
  { name: '宙返り', nameEn: 'Loop', arcDeg: 165, arcR: 10.5, straight: 8.8 },
  { name: '長空', nameEn: 'Long Sky', arcDeg: 172, arcR: 11.5, straight: 14 },
];
const SAMPLE = 0.05;

// ---------- track ----------
const track = [];   // { s, x, y, phi, k } — u<=0 flat approach, then arc + straight
let T_LEN = 0, T_TOP = null;
// road strokes, projected once per course so drawRoad allocates nothing per frame
let roadTop = [], roadBot = [], roadDash = [], roadHazIn = [], roadHazOut = [];
let courseGeo = null; // truss-tower anchors in drawRoad, derived from the course
let courseIdx = 0;
try {
  const ci = +localStorage.getItem('wallflip2.course');
  if (ci >= 0 && ci < COURSES.length) courseIdx = ci;
} catch (e) {}
// rebuild the track polyline and every value derived from it for a course
function buildCourse(idx) {
  const c = COURSES[idx];
  track.length = 0;
  let s = 0, x = 0, y = 0, phi = 0;
  track.push({ s, x, y, phi, k: 0 });
  const arcLen = c.arcDeg * DEG * c.arcR;
  for (let d = SAMPLE; d <= arcLen + 1e-9; d += SAMPLE) {
    const mid = phi + (SAMPLE / c.arcR) / 2;
    x += cos(mid) * SAMPLE; y += sin(mid) * SAMPLE; phi += SAMPLE / c.arcR; s += SAMPLE;
    track.push({ s, x, y, phi, k: 1 / c.arcR });
  }
  const arcEnd = track[track.length - 1];
  x = arcEnd.x; y = arcEnd.y; phi = arcEnd.phi;
  for (let d = SAMPLE; d <= c.straight + 1e-9; d += SAMPLE) {
    x += cos(phi) * SAMPLE; y += sin(phi) * SAMPLE; s += SAMPLE;
    track.push({ s, x, y, phi, k: 0 });
  }
  T_LEN = track[track.length - 1].s;
  T_TOP = track[track.length - 1];
  // truss tower sized from the course (course A reproduces the original fixed
  // values: tower top ≈ 24.5 = arc-end y + 3.86, boom anchor ≈ (2, 12.2) =
  // the 0.25R circle around the arc center at 79% of the arc)
  const bTh = c.arcDeg * 0.788 * DEG, bR = c.arcR * 0.25;
  courseGeo = { x1: 13.2, x2: 18.4, topY: arcEnd.y + 3.86, boomX: bR * sin(bTh), boomY: c.arcR - bR * cos(bTh) };
  // project the ribbon once per course; drawRoad only walks these points
  const ride = [];
  for (let rx = -38; rx < 0.01; rx += 1) ride.push({ x: rx, y: 0, phi: 0 });
  for (let i = 0; i < track.length; i += 2) ride.push(track[i]);
  ride.push(T_TOP);
  const flat = [];
  for (let i = 0; i < ride.length; i++) if (ride[i].x <= 0) flat.push(ride[i]);
  const project = (pts, d) => {
    const out = new Array(pts.length);
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      out[i] = [p.x + sin(p.phi) * d, p.y - cos(p.phi) * d];
    }
    return out;
  };
  roadTop = project(ride, 0);
  roadBot = project(ride, -1.2);
  roadDash = project(ride, -0.62);
  roadHazIn = project(flat, 0.02);
  roadHazOut = project(flat, -1.25);
}
buildCourse(courseIdx);

// track point at arc position u (u<=0 flat, u>=len straight extension)
function trackAt(u) {
  if (u <= 0) return { x: u, y: 0, phi: 0, k: 0 };
  if (u >= T_LEN) {
    const b = u - T_LEN;
    return { x: T_TOP.x + cos(T_TOP.phi) * b, y: T_TOP.y + sin(T_TOP.phi) * b, phi: T_TOP.phi, k: 0 };
  }
  let i = clamp(Math.floor(u / SAMPLE), 0, track.length - 2);
  while (i > 0 && track[i].s > u) i--;
  while (i < track.length - 2 && track[i + 1].s < u) i++;
  const a = track[i], b = track[i + 1], f = clamp((u - a.s) / Math.max(1e-9, b.s - a.s), 0, 1);
  return { x: lerp(a.x, b.x, f), y: lerp(a.y, b.y, f), phi: lerp(a.phi, b.phi, f), k: b.k };
}
// car body pose from wheel-contact positions (original Qe)
function bodyPose(u) {
  const a = trackAt(u - CAR.WHEEL_X), b = trackAt(u + CAR.WHEEL_X);
  const th = Math.atan2(b.y - a.y, b.x - a.x);
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  return { x: mx - sin(th) * CAR.H, y: my + cos(th) * CAR.H, th };
}
// closest point on the structure polyline (original oe): null on the flat ends
function closestOnTrack(px, py) {
  let best = Infinity, out = null;
  for (let i = 0; i < track.length; i++) {
    const p = track[i];
    const dx = px - p.x, dy = py - p.y, d2 = dx * dx + dy * dy;
    if (d2 >= best) continue;
    best = d2;
    const along = cos(p.phi) * dx + sin(p.phi) * dy;
    out = (i === track.length - 1 && along > 0) || (i === 0 && along < 0) ? null

  if (k) { inp[k] = false; activePtr.delete(e.pointerId); }
}
addEventListener('pointerup', ptrEnd);
addEventListener('pointercancel', ptrEnd);

// ---------- particles ----------
function dust(x, y, n, pw) {
  for (let i = 0; i < n; i++) parts.push({ kind: 'dust', x: x + rand(-1, 1), y: y + rand(0, .3), vx: rand(-2, 2) * pw, vy: rand(.5, 3) * pw, r: rand(.15, .5), t: 0, life: rand(.4, 1) });
}
function smoke(x, y, n) {
  for (let i = 0; i < n; i++) parts.push({ kind: 'smoke', x: x + rand(-1, 1), y: y + rand(-.5, 1), vx: rand(-3, 3), vy: rand(1, 4), r: rand(.4, 1.1), t: 0, life: rand(.8, 1.8) });
}
function fire(x, y, n) {
  for (let i = 0; i < n; i++) parts.push({ kind: 'fire', x: x + rand(-1, 1), y: y + rand(0, .6), vx: rand(-.5, .5), vy: rand(2, 4), r: rand(.3, .8), t: 0, life: rand(.4, .8) });
}
function tireSmoke(x, y, n) {
  for (let i = 0; i < n; i++) parts.push({ kind: 'tire', x: x + rand(-.6, .6), y: y + rand(-.2, .2), vx: rand(-1, 1), vy: rand(-1, 1), r: rand(.3, .6), t: 0, life: rand(.5, .9) });
}
function confetti(x, y, n) {
  const cols = ['#ffd166', '#ef476f', '#06d6a0', '#4cc9f0', '#f4b942'];
  for (let i = 0; i < n; i++) parts.push({ kind: 'conf', x, y, vx: rand(-8, 8), vy: rand(4, 14), r: rand(.12, .3), col: cols[(Math.random() * cols.length) | 0], t: 0, life: rand(1, 2), rot: rand(0, TAU), vr: rand(-8, 8) });
}
function stepParts(dt) {
  for (let i = skids.length - 1; i >= 0; i--) {
    skids[i].a -= dt / 7;
    if (skids[i].a <= 0) skids.splice(i, 1);
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.t += dt;
    if (p.t > p.life) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === 'dust' || p.kind === 'smoke' || p.kind === 'tire') { p.vx *= 0.96; p.vy = p.vy * 0.96 + (p.kind === 'smoke' ? 1.5 : 4) * dt; }
    else if (p.kind === 'fire') p.vy -= 4 * dt;
    else if (p.kind === 'conf') { p.vy -= 18 * dt; p.rot += p.vr * dt; p.vx *= 0.99; }
  }
  for (let i = pops.length - 1; i >= 0; i--) { pops[i].t += dt; if (pops[i].t > 1) pops.splice(i, 1); }
}

// ---------- flow ----------
function reset(ready) {
  buildCourse(courseIdx); // rebuild course-derived state (cheap; guards course switches)
  const p0 = bodyPose(0);
  car.mode = 'road'; car.u = -RUNUP; car.v = 0;
  car.x = p0.x - RUNUP; car.y = p0.y; car.th = 0;
  car.phi = 0; car.phiL = 0; car.rw = 0;
  car.vx = car.vy = 0;
  car.air = AIR_MAX; car.airTime = 0; car.time = 0;
  car.suck = car.drive = car.slip = car.onWall = false;
  car.clear = false; car.peeled = car.lifted = car.launched = false;
  car.land = null; car.crash = null; car.pw = 0; car.flipT = 0;
  car.squash = 0; car.squashV = 0;
  msgs.length = 0; pops.length = parts.length = 0;
  for (const k in saidOnce) delete saidOnce[k];
  newBest = false;
  // ghost: archive the finished run as the same-session ghost, restart the clock
  if (ghostRec.length) ghostSession = ghostRec;
  ghostRec = [];
  ghostFrame = 0;
  ghostPlay = ghostSavedFrames.length ? ghostSavedFrames : ghostSession;
  ghostPlayStep = ghostSavedFrames.length ? ghostSavedStep : 1;
  rankOn = false; rankHi = -1; onlineHi = -1; lastSubmit = null;
  inputLog.length = 0; inputLogFrames = 0; inputLogLast = -1;  // fresh input log per run
  apiPanel.classList.remove('on'); namePanel.classList.remove('on');
  stats.win = false; stats.reason = '';
  cam.snap = false;
  state = ready ? ST.READY : ST.RUN;
  stateT = 0;
}
function startRun() { reset(false); }

function toAir(kind) {
  if (car.mode === 'crash') return;
  if (car.u >= T_LEN) kind = 'launch';
  else if (car.u <= 0.5) kind = 'lift';
  const k = trackAt(car.u);
  car.mode = 'air'; car.airTime = 0;
  car.vx = cos(k.phi) * car.v; car.vy = sin(k.phi) * car.v;
  car.phi = k.phi; car.phiL = k.phi; car.rw = 0;
  launchX = car.x;
  car.peeled = kind === 'detach'; car.lifted = kind === 'lift'; car.launched = kind === 'launch';
  car.plan = botOn && car.air > 50 ? 1 : 0;
  // bot roll target fixed at launch: next wheels-down angle (+ planned full rolls)
  car.targetPhi = Math.ceil((car.phi - 1e-6) / TAU) * TAU + car.plan * TAU;
  car.clear = false;
  if (kind === 'launch') sayOnce('launch', t('mLaunch'), '#9fe8ff');
  if (kind === 'detach') { say(t('mPeel'), '#ff6b6b', 2.2); sfx.peel(); pop(car.x, car.y + 2, 'PEEL!', '#ff6b6b'); }
}
function doCrash(reason) {
  if (car.mode === 'crash') return;
  car.mode = 'crash'; car.crash = reason;
  if (car.vy > 0) car.vy *= 0.3;
  car.pw = rand(-4, 4);
  stats.reason = reason; stats.win = false;
  stats.fall = Math.hypot(car.vx, car.vy) * 3.6;
  stats.tilt = tiltNow() / DEG;
  stats.dist = Math.abs(car.x - launchX);
  stats.rolls = rollsCount(car.phi, car.phiL);
  smoke(car.x, car.y + .5, 14); fire(car.x, car.y + .4, 14);
  shakeT = 0.5; shakeA = 0.35;
  sfx.crash();
  vib([60, 40, 60]);
  say(reason === 'fall' ? t('mPeel') : reason === 'wall' ? t('rWall') : reason === 'hard' ? t('rHard', fmt(stats.fall)) : t('rTilt', fmt(stats.tilt, 1)), '#ff6b6b', 2.4);
  stateT = 0;
}
function tiltNow() {
  // angular deviation from the wheels-down attitude (phi ≡ 0 mod 2π)
  const m = ((car.phi % TAU) + TAU) % TAU;
  return Math.min(m, TAU - m);
}
let launchX = 0;
let slipWordAt = -9;

// ---------- achievements / share / haptics (P4) ----------
const ACH = [
  { id: 'land' }, { id: 'roll1' }, { id: 'roll2' }, { id: 'roll3' },
  { id: 'soft30' }, { id: 'legend' }, { id: 'far100' }, { id: 'eco' },
];
let achUnlocked = new Set();
try { achUnlocked = new Set(JSON.parse(localStorage.getItem('wallflip2.ach') || '[]')); } catch (e) {}
function achTest(id, s) {
  switch (id) {
    case 'land': return true;
    case 'roll1': return s.rolls >= 1;
    case 'roll2': return s.rolls >= 2;
    case 'roll3': return s.rolls >= 3;
    case 'soft30': return s.soft >= 30;
    case 'legend': return s.total >= 140;
    case 'far100': return s.dist >= 100;
    case 'eco': return car.air >= 60;
  }
  return false;
}
function unlockAchievements() {
  const gained = [];
  for (const a of ACH) {
    if (achUnlocked.has(a.id)) continue;
    if (achTest(a.id, stats)) {
      achUnlocked.add(a.id);
      gained.push(a.id);
      pop(car.x + rand(-1.5, 1.5), car.y + rand(2, 4), '🏆 ' + t('ach_' + a.id), '#ffd166');
    }
  }
  if (gained.length) {
    try { localStorage.setItem('wallflip2.ach', JSON.stringify([...achUnlocked])); } catch (e) {}
    say(t('mAch', gained.map(id => t('ach_' + id)).join(t('achJoin'))), '#ffd166', 2.6);
  }
}
function vib(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
}
function copyResult() {
  const cn = courseName(COURSES[courseIdx]);
  let rank = 'GOOD!';
  for (const [th, name] of RANKS) if (stats.total >= th) { rank = name; break; }
  const text = t('shareText', stats.rolls, Math.round(stats.dist), stats.soft, stats.level, stats.total, rank, cn);
  const done = () => say(t('mCopied'), '#9fe8ff', 1.8);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch (e) {}
  ta.remove();
}

// ---------- physics: attached (original M) ----------
function stepRoad(dt) {
  const sm = trackAt(car.u);
  const canSuck = inp.stick && car.air > 0;
  if (canSuck) car.air = Math.max(0, car.air - AIR_SUCK * dt);
  const A = canSuck ? SUCK : 0;
  const jetL = inp.left && car.air > 0, jetR = inp.right && car.air > 0;
  const Z = (jetL ? 1 : 0) + (jetR ? 1 : 0);
  if (Z) car.air = Math.max(0, car.air - AIR_JET * Z * dt);
  car.suck = canSuck; car.onWall = car.u > 0;
  let N = car.v * car.v * sm.k + G * cos(sm.phi) - THRUST * Z;
  const grip = car.onWall ? clamp((N + A) / (G * 1.5), 0, 1) : 1;
  if (car.onWall && sm.phi > 100 * DEG && !canSuck) sayOnce('grip', t('mGrip'), '#ffd166');
  if ((car.onWall || Z) && N + A < 0) { toAir('detach'); return; }
  const tract = MU * Math.max(0, N + A);
  let o = 0;
  car.slip = false;
  if (inp.drive) {
    const l = car.v >= VMAX ? 0 : Math.min(MOTOR_A, MOTOR_P / Math.max(car.v, 1));
    o = Math.min(l, tract);
    car.slip = l > tract + 0.5;
  }
  o -= G * sin(sm.phi);
  o -= Math.sign(car.v) * (ROLL_RES + DRAG * car.v * car.v + (inp.drive ? 0 : COAST));
  if (!inp.drive && !car.onWall && Math.abs(car.v) < 0.3) { car.v = 0; o = 0; }
  if (car.onWall && !inp.drive && car.v <= 0) {
    const f = -CREEP * sin(sm.phi);
    car.v = car.v > f ? Math.max(f, car.v - G * sin(sm.phi) * dt) : Math.min(f, car.v + COAST * dt);
  } else car.v += o * dt;
  car.u += car.v * dt;
  if (car.u < -RUNUP) { car.u = -RUNUP; car.v = Math.max(0, car.v); }
  car.drive = !!inp.drive;
  if (car.slip) {
    tireSmoke(car.x - Math.sign(car.v) * 1.4, car.y - CAR.H * 0.6, 1);
    if (car.time - slipWordAt > 1.2) { slipWordAt = car.time; pop(car.x, car.y + 2, 'SLIP', 'hsl(35 90% 50%)'); }
  }
  if (car.slip && car.u < 0 && skids.length < 260) {
    skids.push({ x: car.x - 1.38, a: 0.4 }, { x: car.x + 1.38, a: 0.4 });
  }
  if (car.u - CAR.WHEEL_X >= T_LEN) { toAir('launch'); return; }
  const p2 = bodyPose(car.u);
  car.x = p2.x; car.y = p2.y; car.th = p2.th;
  car.od = (car.od || 0) - car.v * dt / CAR.WHEEL_R;
  // dust while driving on the flat
  if (Math.abs(car.v) > 6 && car.u < 0 && Math.random() < 0.4) dust(car.x - Math.sign(car.v) * 1.6, 0.05, 1, Math.min(1.2, Math.abs(car.v) / 30));
}

// ---------- physics: air (original b) ----------
function localPoint(pt) {
  const c = cos(car.phi), s = sin(car.phi);
  return [car.x + c * pt[0] - s * pt[1], car.y + s * pt[0] + c * pt[1]];
}
function stepAir(dt) {
  car.airTime += dt;
  const jL = inp.left && car.air > 0, jR = inp.right && car.air > 0;
  const Z = (jL ? 1 : 0) + (jR ? 1 : 0);
  if (Z) car.air = Math.max(0, car.air - AIR_JET * Z * dt);
  const rx = -sin(car.phi), ry = cos(car.phi); // roof direction
  car.vx += rx * THRUST * Z * dt;
  car.vy += (ry * THRUST * Z - G * AIR_G) * dt;
  const damp = (jL !== jR) ? SPIN_DAMP : ROLL_DAMP;
  car.rw += (((jL ? 1 : 0) - (jR ? 1 : 0)) * ANG - car.rw * damp) * dt;
  car.x += car.vx * dt; car.y += car.vy * dt;
  car.phi += car.rw * dt;
  car.od = (car.od || 0) - Math.hypot(car.vx, car.vy) * dt / CAR.WHEEL_R;
  car.left = jL; car.right = jR; car.suck = false; car.drive = false;
  if (!car.clear) {
    const S = closestOnTrack(car.x, car.y);
    car.clear = !S || Math.abs(S.n) > LEVEL_CLEAR;
  }
  // structure scrape/crash
  if (car.airTime > GRACE) {
    for (const pt of POINTS) {
      const [wx, wy] = localPoint(pt);
      const S = closestOnTrack(wx, wy);
      if (!S || S.n >= -0.02 || S.n < -1.5) continue;
      const J = car.vx * S.nx + car.vy * S.ny;
      if (J < -WALL_CRASH) { doCrash(car.peeled ? 'fall' : 'wall'); return; }
      car.x -= S.nx * S.n; car.y -= S.ny * S.n;
      if (J < 0) { car.vx -= J * S.nx * 1.2; car.vy -= J * S.ny * 1.2; }
      car.vx *= 1 - Math.min(1, dt * 1.5); car.vy *= 1 - Math.min(1, dt * 1.5);
    }
  }
  // ground contact
  let low = null;
  for (const pt of POINTS) {
    const [wx, wy] = localPoint(pt);
    if (wy <= 0 && (!low || wy < low.wy)) low = { pt, wx, wy };
  }
  if (!low) return;
  const tilt = tiltNow();
  const c = cos(car.phi), s = sin(car.phi);
  const offX = c * low.pt[0] - s * low.pt[1];
  const fall = -(car.vy + car.rw * offX);
  if (low.pt[2] !== 1 || tilt > LAND_TILT) { doCrash('tilt'); return; }
  if (fall > LAND_SPEED || Math.abs(car.rw) > LAND_SPIN) { doCrash('hard'); return; }
  if (car.lifted && car.x <= 0) { // soft re-touch after a ground hop
    car.mode = 'road'; car.u = Math.max(-RUNUP, car.x); car.v = car.vx; car.rw = 0;
    const p2 = bodyPose(car.u);
    car.x = p2.x; car.y = p2.y; car.th = p2.th;
    return;
  }
  car.mode = 'landed';
  car.landPhi = Math.round(car.phi / Math.PI) * Math.PI; // snap to wheels-down
  car.flipT = 0;
  car.squashV = clamp(fall / 6, 0, 1.4);
  stats.rolls = rollsCount(car.phi, car.phiL);
  stats.fall = fall * 3.6;
  stats.tilt = tilt / DEG;
  stats.dist = Math.abs(car.x - launchX);
  stats.soft = Math.round(30 * clamp(1 - fall / LAND_SPEED, 0, 1));
  stats.level = Math.round(20 * clamp(1 - tilt / LAND_TILT, 0, 1));
  stats.rollPts = 50 * stats.rolls;
  stats.total = Math.round(stats.rollPts + stats.soft + stats.level);
  stats.win = true;
  stats.time = car.time;
  stats.newTimeRecord = false;
  if (!botOn) { // bot/demo runs never touch records or achievements
    const tk = 'wallflip2.time.' + courseIdx;
    let bestTime = 0;
    try { bestTime = +localStorage.getItem(tk) || 0; } catch (e) {}
    stats.newTimeRecord = !bestTime || stats.time < bestTime;
    if (stats.newTimeRecord) { try { localStorage.setItem(tk, stats.time.toFixed(2)); } catch (e) {} }
    unlockAchievements();
  }
  vib(stats.total >= 95 ? [20, 30, 20] : 25);
  const q = (stats.soft + stats.level) / 50;
  sfx.land(q);
  dust(car.x, 0, Math.floor(6 + fall * 2), 1);
  if (fall > 3) { shakeT = 0.25; shakeA = 0.2; }
  if (stats.rolls >= 2) confetti(car.x, 2, 24 + stats.rolls * 10);
  let rank = 'GOOD!', rcol = '#cfe3f5';
  for (const [th, name, col] of RANKS) if (stats.total >= th) { rank = name; rcol = col; break; }
  pop(car.x, 2.2, `+${stats.total}`, '#ffd166');
  pop(car.x, 0.4, rank, rcol);
  say(t('mLand', stats.soft, stats.level), q > 0.75 ? '#ffd166' : '#9fe8ff', 2.4);
  stateT = 0;
}

// ---------- physics: landed rollout (original g) ----------
function stepLanded(dt) {
  const k = Math.min(1, dt * 12);
  car.phi += (car.landPhi - car.phi) * k;
  car.rw = 0; car.vy = 0; car.y = CAR.H;
  car.flipT = Math.min(1, car.flipT + dt * 3.2);
  car.squashV += -car.squash * 90 * dt - car.squashV * 9 * dt;
  car.squash += car.squashV * dt;
  const E = 7 * dt;
  car.vx = Math.abs(car.vx) <= E ? 0 : car.vx - Math.sign(car.vx) * E;
  car.x += car.vx * dt;
  car.od = (car.od || 0) - car.vx * dt / CAR.WHEEL_R;
  if (Math.abs(car.vx) > 8 && car.x < 0 && skids.length < 260) {
    skids.push({ x: car.x - CAR.WHEEL_X, a: 0.45 }, { x: car.x + CAR.WHEEL_X, a: 0.45 });
  }
  if (Math.abs(car.vx) > 3 && Math.random() < 0.4) dust(car.x - Math.sign(car.vx) * 1.6, 0.05, 1, 1);
  if (state === ST.RUN && stateT > 1.6) showResult();
}

// ---------- physics: crash tumble (original P) ----------
function stepCrash(dt) {
  car.vy -= G * dt;
  car.x += car.vx * dt; car.y += car.vy * dt;
  car.phi += car.rw * dt; car.phi += (car.pw || 0) * dt;
  const S = closestOnTrack(car.x, car.y);
  if (S && S.n < 0.7 && S.n > -1.5) {
    car.x += S.nx * (0.7 - S.n); car.y += S.ny * (0.7 - S.n);
    const H = car.vx * S.nx + car.vy * S.ny;
    if (H < 0) { car.vx -= H * S.nx * 1.2; car.vy -= H * S.ny * 1.2; }
    car.vx *= 1 - dt * 2; car.vy *= 1 - dt * 2; car.rw *= 1 - dt * 3;
  }
  let low = Infinity;
  for (const pt of POINTS) {
    const [wx, wy] = localPoint(pt);
    low = Math.min(low, wy);
  }
  if (low < 0) {
    car.y -= low;
    if (car.vy < 0) car.vy = -car.vy * 0.3;
    car.vx *= 0.6; car.rw *= 0.6; car.pw *= 0.6;
  }
  if (low < 0.05 && Math.abs(car.vy) < 1.5) {
    const k = Math.min(1, dt * 6);
    car.phi += (Math.round(car.phi / Math.PI) * Math.PI - car.phi) * k;
    car.rw *= 1 - k; car.pw *= 1 - k;
    car.vx *= 1 - Math.min(1, dt * 2);
  }
  if (Math.random() < 0.2) smoke(car.x + rand(-1, 1), car.y + rand(0, 1), 1);
  if (Math.random() < 0.15) fire(car.x + rand(-1, 1), car.y + rand(0, .6), 1);
  if (state === ST.RUN && stateT > 1.7) showResult();
}

function showResult() {
  if (stats.win) {
    if (!botOn) { // bot/demo runs never write best / board / ghost
      if (stats.total > best) {
        best = stats.total; newBest = true;
        try { localStorage.setItem(bestKey(), best); } catch (e) {}
        sfx.best();
      }
      if (stats.total > 0) boardAdd();
      if (ghostOn && stats.total > ghostBest) saveGhost();
    }
    // online submit: offer the name-entry panel shortly after the result
    // settles (never for bot/demo runs, only when a rank API is configured)
    if (!botOn && apiBase() && !submitThrottled()) {
      setTimeout(() => {
        if (!botOn && state === ST.RESULT && stats.win && stats.total > 0) openNamePanel();
      }, 900);
    }
  } else {
    stats.soft = 0; stats.level = 0; stats.rollPts = 0; stats.total = 0;
  }
  state = ST.RESULT; stateT = 0;
}

function stepPhysics(dt) {
  if (botOn) botControl();
  if (state === ST.RUN) logInputFrame(); // input bitmask log (replay verification)
  // the world keeps simulating behind the result panel (original behavior)
  if (state === ST.RUN || state === ST.RESULT) {
    car.time += dt;
    if (car.mode === 'road') stepRoad(dt);
    else if (car.mode === 'air') stepAir(dt);
    else if (car.mode === 'landed') stepLanded(dt);
    else stepCrash(dt);
  }
  // ghost recording: passive 120 Hz pose capture, frame-index synced (no physics effect);
  // stops by itself at the touchdown/crash (rollout and tumble are not recorded)
  if (ghostOn && (state === ST.RUN || state === ST.RESULT)) {
    ghostFrame++;
    if (state === ST.RUN && (ghostFrame & 1) === 1 && ghostRec.length < GHOST_CAP &&
        (car.mode === 'road' || car.mode === 'air')) {
      ghostRec.push([+car.x.toFixed(2), +car.y.toFixed(2),
        +(car.mode === 'road' ? car.th : car.phi).toFixed(3)]);
    }
  }
  car.squashV += -car.squash * 90 * dt - car.squashV * 9 * dt;
  car.squash += car.squashV * dt;
  stepParts(dt);
  for (let i = msgs.length - 1; i >= 0; i--) { msgs[i].t += dt; if (msgs[i].t > msgs[i].life) msgs.splice(i, 1); }
  for (const p of pops) p.t += dt * 1.2;
  if (state !== ST.READY) stateT += dt;
}

// ---------- bot (demo autopilot) ----------
function botControl() {
  inp.drive = inp.stick = inp.left = inp.right = false;
  if (car.mode === 'road') {
    inp.drive = true;
    if (car.u > 0) inp.stick = true; // hold through the wall (free when N > 0)
  } else if (car.mode === 'air') {
    // original-style spin control: a single jet spins up (light damping);
    // releasing lets ROLL_DAMP stop it. Remaining coast rotation = rw/ROLL_DAMP.
    // Sequence matters: finish the roll FIRST, only then brake with both jets
    // (firing both cancels the roll torque). Target fixed at launch.
    const target = car.targetPhi;
    const err = car.phi + car.rw / ROLL_DAMP - target;
    if (Math.abs(err) > 0.06) {
      if (err < 0) { if (car.air > 2) inp.left = true; }
      else if (car.air > 2) inp.right = true;
    } else {

function drawGhost() {

  ctx.textAlign = 'center';

  for (const msg of msgs) {
    const a = clamp(msg.t * 5, 0, 1) * clamp((msg.life - msg.t) * 2.5, 0, 1);
    ctx.globalAlpha = a;
    ctx.font = `600 ${Math.min(W() * 0.028, 18)}px ${SANS}`;
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(4,6,10,.85)';
    ctx.strokeText(msg.text, W() / 2, my);
    ctx.fillStyle = msg.color;
    ctx.fillText(msg.text, W() / 2, my);
    my += 24;
  }
  ctx.globalAlpha = 1;
  if (car.suck && car.mode === 'road' && car.u > 0) {
    ctx.font = `600 12px ${SANS}`;
    ctx.fillStyle = UI.text;
    ctx.fillText(t('suckOn'), W() / 2, 68);
  }
  if (isTouch || activePtr.size) {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const b of btns) {
      const on = inp[b.key];
      ctx.globalAlpha = on ? 1 : 0.75;
      ctx.fillStyle = b.key === 'drive' ? '#1f9d61' : b.key === 'stick' ? '#eef4fa' : '#3f8cff';
      roundRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h, b.h / 2);
      ctx.fill();
      if (on) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        roundRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h, b.h / 2);
        ctx.stroke();
      }
      ctx.fillStyle = b.key === 'stick' ? '#1f9d61' : '#fff';
      ctx.font = `600 ${b.h * 0.42}px ${SANS}`;
      ctx.fillText(t(b.labelKey), b.x, b.y - b.h * 0.12);
      ctx.font = `500 ${b.h * 0.26}px ${SANS}`;
      ctx.fillText(b.sub, b.x, b.y + b.h * 0.26);
    }
    ctx.globalAlpha = 1;
    ctx.textBaseline = 'alphabetic';
  }
}

const RANKS = [[140, 'LEGEND!!!', '#ffd166'], [95, 'PERFECT!!', '#ff9f43'], [80, 'GREAT!', '#9fe8ff'], [0, 'GOOD!', '#cfe3f5']];
function drawReady() {
  screenTransform();
  ctx.fillStyle = 'rgba(4,6,12,.72)';
  ctx.fillRect(0, 0, W(), H());
  const cx = W() / 2;
  const controlsY = 14;
  const ch = 28;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  ctx.font = `600 13px ${SANS}`;
  const boardLabel = t('boardBtn');
  const boardW = ctx.measureText(boardLabel).width + 12;
  const boardX = W() - 16 - boardW;
  ctx.fillStyle = UI.text;
  ctx.fillText(boardLabel, boardX + boardW / 2, controlsY + ch / 2);
  readyUI.board = { x: boardX, y: controlsY, w: boardW, h: ch };
  const langLabel = t('langBtn');
  ctx.font = `600 12px ${SANS}`;
  const langW = Math.max(44, ctx.measureText(langLabel).width + 18);
  const langX = boardX - 8 - langW;
  ctx.strokeStyle = '#3a4454';
  ctx.lineWidth = 1;
  roundRect(langX, controlsY, langW, ch, 6);
  ctx.stroke();
  ctx.fillStyle = UI.text;
  ctx.fillText(langLabel, langX + langW / 2, controlsY + ch / 2 + 0.5);
  readyUI.lang = { x: langX, y: controlsY, w: langW, h: ch };
  const ghostLabel = t('ghostBtn') + ' ' + (ghostOn ? t('ghostOn') : t('ghostOff'));
  ctx.font = `600 13px ${SANS}`;
  const ghostW = ctx.measureText(ghostLabel).width + 12;
  const ghostX = langX - 10 - ghostW;
  ctx.fillStyle = ghostOn ? UI.text : UI.faint;
  ctx.fillText(ghostLabel, ghostX + ghostW / 2, controlsY + ch / 2);
  readyUI.ghost = { x: ghostX, y: controlsY, w: ghostW, h: ch };

  ctx.textBaseline = 'alphabetic';
  const titleY = Math.max(96, H() * 0.16);
  const left = Math.max(28, cx - 240);
  {
    ctx.font = `500 12px ${SANS}`;
    const labels = ACH.map(a => t('ach_' + a.id));
    const gap = 16;
    const totalW = labels.reduce((s, lab) => s + ctx.measureText(lab).width, 0) + gap * (labels.length - 1);
    const achRowsN = totalW > W() - 48 ? 2 : 1;
    const selW0 = Math.min(320, W() - 48);
    const top = titleY - 50;
    const bot = titleY + 356 + achRowsN * 22;
    const sheetX = Math.max(16, Math.min(left - 28, cx - selW0 / 2 - 20));
    const sheetR = Math.min(W() - 16, Math.max(cx + (cx - sheetX), cx + selW0 / 2 + 20));
    ctx.fillStyle = UI.sheet;
    roundRect(sheetX, top, sheetR - sheetX, bot - top, 8);
    ctx.fill();
    ctx.strokeStyle = UI.line;
    ctx.lineWidth = 1;
    roundRect(sheetX, top, sheetR - sheetX, bot - top, 8);
    ctx.stroke();
  }
  ctx.textAlign = 'center';
  ctx.font = `500 12px ${MONO}`;
  ctx.fillStyle = UI.muted;
  ctx.fillText(lang === 'en' ? 'NIGHT RUN' : 'WALL FLIP', cx, titleY - 28);
  ctx.font = `600 32px ${SANS}`;
  ctx.fillStyle = UI.text;
  ctx.fillText(lang === 'en' ? 'WALL FLIP' : '牆上翻滾', cx, titleY);
  ctx.font = `400 14px ${SANS}`;
  ctx.fillStyle = UI.muted;
  ctx.fillText(t('sub'), cx, titleY + 26);

  const lines = [[t('s1a'), t('s1b')], [t('s2a'), t('s2b')], [t('s3a'), t('s3b')], [t('s4a'), t('s4b')]];
  let y = titleY + 64;
  ctx.textAlign = 'left';
  for (const [head, body] of lines) {
    ctx.font = `600 15px ${SANS}`;
    ctx.fillStyle = UI.text;
    ctx.fillText(head, left, y);
    ctx.font = `400 13px ${SANS}`;
    ctx.fillStyle = UI.muted;
    ctx.fillText(body, left, y + 18);
    y += 44;
  }
  ctx.textAlign = 'center';
  ctx.font = `400 12px ${SANS}`;
  ctx.fillStyle = UI.faint;
  ctx.fillText(t('hint'), cx, y + 8);

  const cc = COURSES[courseIdx];
  const selW = Math.min(320, W() - 48);
  const selX = cx - selW / 2;
  const selY = y + 40;
  ctx.strokeStyle = UI.line;
  ctx.lineWidth = 1;
  roundRect(selX, selY - 16, selW, 32, 6);
  ctx.stroke();
  ctx.fillStyle = UI.muted;
  ctx.font = `500 16px ${SANS}`;
  ctx.fillText('‹', selX + 22, selY + 5);
  ctx.fillText('›', selX + selW - 22, selY + 5);
  const cname = `${t('course')} · ${courseName(cc)}`;
  ctx.font = `600 15px ${SANS}`;
  ctx.fillStyle = UI.text;
  ctx.fillText(cname, cx, selY + 5);
  const nw = ctx.measureText(cname).width;
  ctx.strokeStyle = UI.text;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - nw / 2 - 8, selY + 12);
  ctx.lineTo(cx + nw / 2 + 8, selY + 12);
  ctx.stroke();
  readyUI.prev = { x: selX, y: selY - 16, w: 44, h: 32 };
  readyUI.next = { x: selX + selW - 44, y: selY - 16, w: 44, h: 32 };
  ctx.font = `400 12px ${SANS}`;
  ctx.fillStyle = UI.faint;
  ctx.fillText(`${cc.arcDeg}° ${t('arc')} · ${t('radius')} ${cc.arcR} m · ${t('straight')} ${cc.straight} m`, cx, selY + 34);

  ctx.font = `500 12px ${SANS}`;
  const achLabels = ACH.map(a => t('ach_' + a.id));
  const gap = 16;
  const widths = achLabels.map(lab => ctx.measureText(lab).width);
  const totalW = widths.reduce((s, w) => s + w, 0) + gap * (achLabels.length - 1);
  const achRows = totalW > W() - 48 ? [achLabels.slice(0, 4), achLabels.slice(4)] : [achLabels];
  const widthRows = totalW > W() - 48 ? [widths.slice(0, 4), widths.slice(4)] : [widths];
  let ay = selY + 64;
  achRows.forEach((row, ri) => {
    const rowW = widthRows[ri].reduce((s, w) => s + w, 0) + gap * (row.length - 1);
    let bx = cx - rowW / 2;
    row.forEach((lab, i) => {
      const id = ACH[ri * 4 + i].id;
      ctx.fillStyle = achUnlocked.has(id) ? UI.record : UI.faint;
      ctx.textAlign = 'left';
      ctx.fillText(lab, bx, ay);
      bx += widthRows[ri][i] + gap;
    });
    ay += 22;
  });

  ctx.textAlign = 'center';
  ctx.globalAlpha = 0.55 + 0.45 * Math.sin(stateT * 3.5);
  ctx.font = `600 14px ${SANS}`;
  ctx.fillStyle = UI.text;
  ctx.fillText(isTouch ? t('tapStart') : t('start'), cx, Math.max(ay + 28, H() * 0.9));
  ctx.globalAlpha = 1;
  ctx.font = `400 12px ${SANS}`;
  ctx.fillStyle = UI.faint;
  ctx.fillText(t('footer'), cx, Math.max(ay + 52, H() * 0.95));
}
function drawResult() {
  screenTransform();
  resultUI.share = null;
  const cx = W() / 2;
  ctx.fillStyle = `rgba(4,6,12,${0.42 * Math.min(1, stateT / 0.4)})`;
  ctx.fillRect(0, 0, W(), H());
  const slide = 1 - Math.pow(1 - Math.min(1, stateT / 0.45), 3);
  const pw = Math.min(W() - 48, 440);
  const pad = 24;
  const px = cx - pw / 2;
  ctx.font = `400 13px ${SANS}`;
  const sub = stats.win
    ? t('subWin', stats.rolls, fmt(stats.dist), fmt(stats.time, 1), stats.newTimeRecord)
    : { fall: t('rFall'), wall: t('rWall'), hard: t('rHard', fmt(stats.fall)), tilt: t('rTilt', fmt(stats.tilt, 1)) }[stats.reason] || '';
  const subLines = wrapText(sub, pw - pad * 2);
  const rows = stats.win ? [
    [t('rowRolls', stats.rolls), '+' + stats.rollPts],
    [t('rowSoft'), stats.soft + ' / 30'],
    [t('rowLevel'), stats.level + ' / 20'],
  ] : [];
  const ph = 24 + 28 + subLines.length * 18 + (stats.win ? 36 + 16 + rows.length * 28 + 28 : 56) + 20;
  const py = -ph + (Math.max(64, H() * 0.12) + ph) * slide;
  ctx.fillStyle = UI.sheet;
  roundRect(px, py, pw, ph, 8);
  ctx.fill();
  ctx.strokeStyle = UI.line;
  ctx.lineWidth = 1;
  roundRect(px, py, pw, ph, 8);
  ctx.stroke();
  ctx.save();
  roundRect(px, py, pw, ph, 8);
  ctx.clip();
  ctx.textBaseline = 'alphabetic';
  let y = py + pad + 6;
  ctx.font = `600 22px ${SANS}`;
  ctx.fillStyle = UI.text;
  ctx.textAlign = 'left';
  ctx.fillText(stats.win ? t('win') : t('lose'), px + pad, y);
  y += 26;
  ctx.font = `400 13px ${SANS}`;
  ctx.fillStyle = UI.muted;
  for (const line of subLines) {
    ctx.fillText(line, px + pad, y);
    y += 18;
  }
  if (stats.win) {
    y += 18;
    let rank = 'GOOD!';
    for (const [th, name] of RANKS) if (stats.total >= th) { rank = name; break; }
    ctx.font = `400 32px ${MONO}`;
    ctx.fillStyle = UI.text;
    ctx.textAlign = 'left';
    ctx.fillText(String(stats.total), px + pad, y);
    const numW = ctx.measureText(String(stats.total)).width;
    ctx.font = `400 13px ${SANS}`;
    ctx.fillStyle = UI.muted;
    ctx.fillText(t('pts'), px + pad + numW + 8, y);
    ctx.font = `600 16px ${SANS}`;
    ctx.fillStyle = stats.total >= 140 ? UI.record : UI.text;
    ctx.textAlign = 'right';
    ctx.fillText(rank, px + pw - pad, y);
    y += 32;
    for (const [a, b] of rows) {
      ctx.font = `400 14px ${SANS}`;
      ctx.fillStyle = UI.muted;
      ctx.textAlign = 'left';
      ctx.fillText(a, px + pad, y);
      ctx.font = `400 16px ${MONO}`;
      ctx.fillStyle = UI.text;
      ctx.textAlign = 'right';
      ctx.fillText(String(b), px + pw - pad, y);
      y += 28;
    }
    ctx.font = `500 12px ${SANS}`;
    ctx.fillStyle = newBest ? UI.record : UI.muted;
    ctx.textAlign = 'right';
    ctx.fillText(newBest ? t('newRecord') : `${t('bestLabel')} ${best}`, px + pw - pad, y);
  } else {
    y += 28;
    ctx.font = `400 32px ${MONO}`;
    ctx.fillStyle = UI.text;
    ctx.textAlign = 'left';
    const zeroW = ctx.measureText('0').width;
    ctx.fillText('0', px + pad, y);
    ctx.font = `400 13px ${SANS}`;
    ctx.fillStyle = UI.muted;
    ctx.fillText(t('pts'), px + pad + zeroW + 8, y);
  }
  ctx.restore();

  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  let below = py + ph + 16;
  if (stats.win) {
    const sh = 32;
    const sw = 168;
    const sx = cx - sw / 2;
    ctx.strokeStyle = '#3a4454';
    ctx.lineWidth = 1;
    roundRect(sx, below, sw, sh, 6);
    ctx.stroke();
    ctx.fillStyle = UI.text;
    ctx.font = `600 13px ${SANS}`;
    ctx.fillText(t('shareBtn'), cx, below + sh / 2);
    resultUI.share = { x: sx, y: below, w: sw, h: sh };
    below += sh + 18;
  }
  ctx.font = `600 14px ${SANS}`;
  ctx.fillStyle = UI.text;
  const bl = t('boardBtn');
  const blw = ctx.measureText(bl).width;
  ctx.fillText(bl, cx, below + 8);
  ctx.strokeStyle = UI.text;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx - blw / 2, below + 18);
  ctx.lineTo(cx + blw / 2, below + 18);
  ctx.stroke();
  resultUI.board = { x: cx - blw / 2 - 12, y: below - 6, w: blw + 24, h: 32 };

  const langLabel = t('langBtn');
  ctx.font = `600 12px ${SANS}`;
  const langW = Math.max(44, ctx.measureText(langLabel).width + 18);
  const langX = W() - 16 - langW;
  const langY = 14;
  ctx.strokeStyle = '#3a4454';
  ctx.lineWidth = 1;
  roundRect(langX, langY, langW, 28, 6);
  ctx.stroke();
  ctx.fillStyle = UI.text;
  ctx.fillText(langLabel, langX + langW / 2, langY + 14);
  resultUI.lang = { x: langX, y: langY, w: langW, h: 28 };
  ctx.textBaseline = 'alphabetic';
}
function drawRank() {
  screenTransform();
  const cx = W() / 2;
  ctx.fillStyle = 'rgba(4,6,12,.78)';
  ctx.fillRect(0, 0, W(), H());
  const hasApi = !!rankApi;
  const showOnline = hasApi && rankTab === 'online' && !!onlineBoard;
  const list = showOnline ? onlineBoard : boardView;
  const rowH = H() < 560 ? 22 : 28;
  const head = hasApi ? 92 : 64;
  const bodyRows = Math.max(list.length, 6);
  const ph = Math.min(H() - 64, head + bodyRows * rowH + 44);
  const pw = Math.min(W() - 32, 520);
  const px = cx - pw / 2;
  const py = Math.max(16, (H() - ph) / 2);
  ctx.fillStyle = UI.sheet;
  roundRect(px, py, pw, ph, 8);
  ctx.fill();
  ctx.strokeStyle = UI.line;
  ctx.lineWidth = 1;
  roundRect(px, py, pw, ph, 8);
  ctx.stroke();
  ctx.textBaseline = 'middle';
  ctx.font = `600 13px ${SANS}`;
  const apiW = ctx.measureText('API').width + 18;
  const gx = px + pw - 16 - apiW;
  const gy = py + 16;
  ctx.strokeStyle = '#3a4454';
  roundRect(gx, gy, apiW, 28, 6);
  ctx.stroke();
  ctx.fillStyle = UI.muted;
  ctx.textAlign = 'center';
  ctx.fillText('API', gx + apiW / 2, gy + 14);
  rankUI.gear = { x: gx, y: gy, w: apiW, h: 28 };

  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.font = `600 16px ${SANS}`;
  ctx.fillStyle = UI.text;
  let title = t('boardTitle', courseName(COURSES[courseIdx]));
  if (showOnline) title += ' · ' + t('onlineMark');
  const maxTitle = gx - (px + 24) - 12;
  while (title.length > 1 && ctx.measureText(title).width > maxTitle) title = title.slice(0, -1);
  if (ctx.measureText(title).width > maxTitle) title = title.slice(0, -1) + '…';
  ctx.fillText(title, px + 24, py + 36);

  let headY = py + (hasApi ? 84 : 58);
  if (hasApi) {
    const ty = py + 52;
    const tab = (x, on, label, key) => {
      ctx.font = on ? `600 14px ${SANS}` : `400 14px ${SANS}`;
      ctx.fillStyle = on ? UI.text : UI.muted;
      ctx.textAlign = 'left';
      ctx.fillText(label, x, ty + 14);
      const tw = ctx.measureText(label).width;
      if (on) {
        ctx.strokeStyle = UI.text;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x - 8, ty + 22);
        ctx.lineTo(x + tw + 8, ty + 22);
        ctx.stroke();
      }
      rankUI[key] = { x: x - 8, y: ty - 4, w: tw + 16, h: 32 };
      return tw;
    };
    const onlineW = tab(px + 24, rankTab === 'online', t('tabOnline'), 'tabOnline');
    tab(px + 24 + onlineW + 28, rankTab === 'local', t('tabLocal'), 'tabLocal');
  } else {
    rankUI.tabOnline = rankUI.tabLocal = null;
  }

  const cS = px + pw * 0.58;
  const cR = px + pw * 0.74;
  const cD = px + pw - 24;
  if (!list.length) {
    ctx.font = `400 14px ${SANS}`;
    ctx.fillStyle = UI.muted;
    ctx.textAlign = 'center';
    ctx.fillText(hasApi && rankTab === 'online' && onlinePending ? '…' : t('boardEmpty'), cx, py + ph / 2);
  } else {
    ctx.font = `600 11px ${SANS}`;
    ctx.fillStyle = UI.faint;
    ctx.textAlign = 'left';
    ctx.fillText(t('colRank'), px + 24, headY);
    ctx.textAlign = 'right';
    ctx.fillText(t('colScore'), cS, headY);
    ctx.fillText(t('colRolls'), cR, headY);
    ctx.fillText(showOnline ? t('colTime') : t('colDate'), cD, headY);
    let ry = headY + rowH;
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      const hi = showOnline ? i === onlineHi : i === rankHi;
      if (hi) {
        ctx.fillStyle = 'rgba(226,179,64,.10)';
        ctx.fillRect(px + 12, ry - 16, pw - 24, rowH - 4);
      }
      ctx.textAlign = 'left';
      ctx.font = `400 14px ${MONO}`;
      ctx.fillStyle = hi ? UI.record : UI.text;
      ctx.fillText(String(i + 1), px + 24, ry);
      if (showOnline) {
        ctx.font = `500 14px ${SANS}`;
        let nm = e.n;
        const nameMax = cS - 72 - (px + 52);
        while (nm.length > 1 && ctx.measureText(nm).width > nameMax) nm = nm.slice(0, -1);
        if (nm !== e.n) nm += '…';
        ctx.fillText(nm, px + 52, ry);
      }
      ctx.textAlign = 'right';
      ctx.font = `400 14px ${MONO}`;
      ctx.fillStyle = hi ? UI.record : UI.text;
      ctx.fillText(fmt(e.s), cS, ry);
      ctx.fillStyle = hi ? UI.record : UI.muted;
      ctx.fillText(fmt(e.r), cR, ry);
      ctx.fillStyle = hi ? UI.record : UI.faint;
      ctx.fillText(showOnline ? (Number.isFinite(e.t) ? fmt(e.t, 1) + 's' : '–') : e.t, cD, ry);
      ry += rowH;
    }
  }
  ctx.textAlign = 'center';
  ctx.font = `400 12px ${SANS}`;
  ctx.fillStyle = UI.faint;
  ctx.fillText(t('boardClose'), cx, py + ph - 16);
}

let shakeT = 0, shakeA = 0;
function render(t) {
  drawSky(t);
  const ox = cam.x, oy = cam.y;
  if (shakeT > 0) { cam.x += shakeA * shakeT * Math.sin(t * 63); cam.y += shakeA * shakeT * Math.sin(t * 71); }
  drawScenery(t);
  drawRoad(t);
  drawSkids();
  drawGhost();
  drawShadow();
  // speed streaks when flying fast
  const flySpd = car.mode === 'road' ? Math.abs(car.v) : Math.hypot(car.vx, car.vy);
  if (flySpd > 30 && car.mode === 'air') {
    worldTransform();
    ctx.strokeStyle = 'rgba(210,222,236,.15)';
    ctx.lineWidth = 0.07;
    ctx.beginPath();
    for (let i = 0; i < 9; i++) {
      const lx = car.x + rand(-16, 16), ly = car.y + rand(-5, 5);
      const len = rand(1.5, 4.5) * -Math.sign(car.vx || 1);
      ctx.moveTo(lx, ly); ctx.lineTo(lx + len, ly);
    }
    ctx.stroke();
  }
  drawParts();
  drawCar(t);
  cam.x = ox; cam.y = oy;
  screenTransform();
  drawPops();
  if (state === ST.RUN) drawHUD();
  if (state === ST.READY) drawReady();
  if (state === ST.RESULT) drawResult();
  if (rankOn) drawRank();
}

// ---------- main loop ----------
const DEMO = new URLSearchParams(location.search).get('demo');
let last = performance.now(), acc = 0, autoRetryT = 0;
function frame(now) {
  try {
    let dt = clamp((now - last) / 1000, 0, 0.05);
    last = now;
    const t = now / 1000;
    acc += dt;
    let n = 0;
    while (acc >= STEP && n < 16) { stepPhysics(STEP); acc -= STEP; n++; }
    if (state === ST.READY) stateT += dt;
    camStep(dt);
    audioFrame();
    shakeT = Math.max(0, shakeT - dt);
    if (DEMO && state === ST.RESULT) {
      autoRetryT += dt;
      if (autoRetryT > 2.5) { autoRetryT = 0; reset(false); }
    } else autoRetryT = 0;
    render(t);
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
resize();
if (DEMO) { botOn = true; state = ST.RUN; }
camSnapSafe();
requestAnimationFrame(frame);
// TEMP deterministic render hook (removed before ship)
window.__wfStep = sec => {
  const n = Math.min(30000, Math.round(sec / STEP));
  for (let i = 0; i < n; i++) { stepPhysics(STEP); if (i % 24 === 0) camStep(STEP * 24); }
  if (state === ST.READY || state === ST.RESULT) stateT += sec;
  render(performance.now() / 1000);
};
function camSnapSafe() {
  const t = camTargets();
  cam.x = t.cx; cam.y = t.cy;
  cam.scale = clamp(Math.min((W() / 2) * 0.94 / Math.max(4, t.w / 2), (H() / 2) * 0.8 / Math.max(4, t.h / 2)), 5, 46);
  cam.snap = true;
}
})();
