<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BADMINTON SMASH DEFENSE</title>
    <!-- Loaded without blocking rendering: the drill must come up even when
         the font host is slow or unreachable. -->
    <link rel="stylesheet" media="print" onload="this.media='all'"
          href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&display=swap">
    <style>
        :root {
            --court-green: #1a472a;
            --court-line: #ffffff;
            --shuttle-cork: #e0e0e0;
            --shuttle-skirt: #ffffff;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0d2b1a;
            font-family: 'Teko', 'Oswald', 'Arial Narrow', system-ui, sans-serif;
            touch-action: none;
            user-select: none;
            cursor: none; /* Hide default cursor */
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; 
        }
        /* HUD */
        #score-board {
            position: absolute;
            top: 20px;
            left: 30px;
            color: #fff;
            font-size: 32px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
            font-weight: 700;
        }

        #speed-display {
            position: absolute;
            top: 20px;
            right: 30px;
            text-align: right;
            transform-origin: right top;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .speed-label {
            color: #aaa;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: -5px;
        }
        .speed-value {
            color: #ff3333; /* Red for danger/speed */
            font-size: 64px;
            font-weight: 700;
            line-height: 0.9;
            text-shadow: 0 0 15px rgba(255, 50, 50, 0.6);
            display: inline-block;
        }
        .speed-unit {
            font-size: 24px;
            color: #fff;
            margin-left: 5px;
        }

        #countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            color: #fff;
            font-weight: 800;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
            opacity: 0;
            pointer-events: none;
        }
        
        /* Game Over Screen */
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: auto;
            background: rgba(0, 40, 0, 0.9);
            padding: 40px;
            border: 2px solid #fff;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            border-radius: 8px;
        }
        h1 {
            color: #fff;
            font-size: 64px;
            margin: 0 0 20px 0;
            text-transform: uppercase;
            line-height: 1;
        }
        #stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-box {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 4px;
        }
        .stat-val {
            font-size: 40px;
            color: #fff;
            line-height: 1;
        }
        .stat-label {
            font-size: 16px;
            color: #aaa;
            text-transform: uppercase;
        }
        button {
            background: #fff;
            border: none;
            color: #004d00;
            padding: 10px 40px;
            font-size: 32px;
            font-family: 'Teko', 'Oswald', 'Arial Narrow', system-ui, sans-serif;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            border-radius: 4px;
        }
        button:hover {
            transform: scale(1.05);
            background: #e6e6e6;
        }
        
        #instructions {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 20px;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div id="score-board">
            HITS: <span id="score-val">0</span> / <span id="max-val">25</span>
        </div>

        <div id="speed-display">
            <div class="speed-label">INCOMING</div>
            <div>
                <span class="speed-value" id="speed-val">0</span>
                <span class="speed-unit">KM/H</span>
            </div>
        </div>
        
        <div id="countdown"></div>

        <div id="game-over">
            <h1>DRILL COMPLETE</h1>
            <div id="stats-grid">
                <div class="stat-box">
                    <div class="stat-val" id="final-hits">0</div>
                    <div class="stat-label">Hits</div>
                </div>
                <div class="stat-box">
                    <div class="stat-val" id="final-accuracy">0%</div>
                    <div class="stat-label">Accuracy</div>
                </div>
                <div class="stat-box">
                    <div class="stat-val" id="final-best">—</div>
                    <div class="stat-label">Best</div>
                </div>
            </div>
            <button id="restart-btn">REPLAY DRILL</button>
        </div>

        <div id="instructions">DRAG to Move &nbsp;|&nbsp; TAP / CLICK to Smash</div>
    </div>

    <script type="module" src="/src/game/main.js"></script>
</body>
</html>
