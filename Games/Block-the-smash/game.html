<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BADMINTON SMASH DEFENSE</title>
    <!-- Loaded without blocking rendering: the drill must come up even when
         the font host is slow or unreachable. -->
    <link rel="stylesheet" media="print" onload="this.media='all'"
          href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&display=swap">
    <style>
        :root {
            --court-green: #1a472a;
            --court-line: #ffffff;
            --shuttle-cork: #e0e0e0;
            --shuttle-skirt: #ffffff;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0d2b1a;
            font-family: 'Teko', 'Oswald', 'Arial Narrow', system-ui, sans-serif;
            touch-action: none;
            user-select: none;
            cursor: none; /* Hide default cursor */
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; 
        }
        /* HUD */
        #score-board {
            position: absolute;
            top: 20px;
            left: 30px;
            color: #fff;
            font-size: 32px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
            font-weight: 700;
        }

        #speed-display {
            position: absolute;
            top: 20px;
            right: 30px;
            text-align: right;
            transform-origin: right top;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .speed-label {
            color: #aaa;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: -5px;
        }
        .speed-value {
            color: #ff3333; /* Red for danger/speed */
            font-size: 64px;
            font-weight: 700;
            line-height: 0.9;
            text-shadow: 0 0 15px rgba(255, 50, 50, 0.6);
            display: inline-block;
        }
        .speed-unit {
            font-size: 24px;
            color: #fff;
            margin-left: 5px;
        }

        #countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            color: #fff;
            font-weight: 800;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
            opacity: 0;
            pointer-events: none;
        }
        
        /* Game Over Screen */
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: auto;
            background: rgba(0, 40, 0, 0.9);
            padding: 40px;
            border: 2px solid #fff;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            border-radius: 8px;
        }
        h1 {
            color: #fff;
            font-size: 64px;
            margin: 0 0 20px 0;
            text-transform: uppercase;
            line-height: 1;
        }
        #stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-box {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 4px;
        }
        .stat-box.wide {
            grid-column: 1 / -1;
        }
        .stat-val {
            font-size: 36px;
            color: #fff;
            line-height: 1;
        }
        .stat-label {
            font-size: 14px;
            color: #aaa;
            text-transform: uppercase;
        }
        #grade-banner {
            font-size: 72px;
            font-weight: 800;
            line-height: 1;
            margin: 0 0 4px 0;
            letter-spacing: 0.08em;
            text-shadow: 0 0 24px rgba(255, 220, 80, 0.45);
        }
        #grade-banner.grade-s { color: #ffe566; }
        #grade-banner.grade-a { color: #7dffb3; }
        #grade-banner.grade-b { color: #7ec8ff; }
        #grade-banner.grade-c { color: #ffb86b; }
        #grade-banner.grade-d { color: #ff7a7a; }
        #result-title {
            color: #fff;
            font-size: 36px;
            margin: 0 0 16px 0;
            text-transform: uppercase;
            line-height: 1.1;
        }
        #new-record {
            display: none;
            color: #ffe566;
            font-size: 18px;
            letter-spacing: 0.12em;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        #end-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        #end-actions button.secondary {
            background: transparent;
            color: #fff;
            border: 2px solid rgba(255,255,255,0.55);
        }
        #phase-banner {
            position: absolute;
            top: 88px;
            left: 50%;
            transform: translateX(-50%);
            padding: 4px 16px;
            border-radius: 999px;
            background: rgba(0,0,0,0.45);
            border: 1px solid rgba(255,255,255,0.2);
            color: #b8ffe0;
            font-size: 20px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            opacity: 0.9;
        }
        #hit-toast {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            font-size: 56px;
            font-weight: 800;
            letter-spacing: 0.06em;
            opacity: 0;
            pointer-events: none;
            text-transform: uppercase;
            transition: opacity 0.12s ease, transform 0.12s ease;
        }
        #hit-toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        #hit-toast.good { color: #7dffb3; text-shadow: 0 0 20px rgba(125,255,179,0.55); }
        #hit-toast.bad { color: #ff6b6b; text-shadow: 0 0 20px rgba(255,80,80,0.55); }
        #combo-hud {
            position: absolute;
            bottom: 70px;
            right: 28px;
            text-align: right;
            color: #ffe566;
            font-size: 28px;
            font-weight: 700;
            text-shadow: 0 0 12px rgba(255,220,80,0.4);
            opacity: 0;
            transition: opacity 0.2s;
        }
        #combo-hud.active { opacity: 1; }
        button {
            background: #fff;
            border: none;
            color: #004d00;
            padding: 10px 28px;
            font-size: 28px;
            font-family: 'Teko', 'Oswald', 'Arial Narrow', system-ui, sans-serif;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            border-radius: 4px;
        }
        button:hover {
            transform: scale(1.05);
            background: #e6e6e6;
        }
        
        #instructions {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 20px;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div id="score-board">
            擋下: <span id="score-val">0</span> / <span id="max-val">25</span>
            <span style="margin-left:12px;color:#ff8a8a;font-size:0.75em">漏接 <span id="miss-val">0</span></span>
        </div>

        <div id="phase-banner">熱身</div>

        <div id="speed-display">
            <div class="speed-label">來球</div>
            <div>
                <span class="speed-value" id="speed-val">0</span>
                <span class="speed-unit">KM/H</span>
            </div>
        </div>

        <div id="combo-hud">連擋 <span id="combo-val">0</span></div>
        <div id="hit-toast"></div>
        
        <div id="countdown"></div>

        <div id="game-over">
            <div id="grade-banner" class="grade-b">B</div>
            <h1 id="result-title">訓練結束</h1>
            <div id="new-record">新紀錄！</div>
            <div id="stats-grid">
                <div class="stat-box">
                    <div class="stat-val" id="final-hits">0</div>
                    <div class="stat-label">主動殺回</div>
                </div>
                <div class="stat-box">
                    <div class="stat-val" id="final-misses">0</div>
                    <div class="stat-label">漏接</div>
                </div>
                <div class="stat-box">
                    <div class="stat-val" id="final-accuracy">0%</div>
                    <div class="stat-label">成功率</div>
                </div>
                <div class="stat-box">
                    <div class="stat-val" id="final-combo">0</div>
                    <div class="stat-label">最高連擋</div>
                </div>
                <div class="stat-box wide">
                    <div class="stat-val" id="final-best">—</div>
                    <div class="stat-label">此設定最佳成功率</div>
                </div>
            </div>
            <div id="end-actions">
                <button type="button" id="restart-btn">再練一場</button>
                <button type="button" id="menu-btn" class="secondary">換設定</button>
            </div>
        </div>

        <div id="instructions">拖曳移動球拍 · 點擊／輕觸揮拍擋殺</div>
    </div>

    <script type="module" src="/src/game/main.js"></script>
</body>
</html>
