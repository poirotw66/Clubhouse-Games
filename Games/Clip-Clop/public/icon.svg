<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#9fd8f5"/>
  <rect x="40" y="330" width="432" height="26" rx="13" fill="#c09a6a"/>
  <!-- horse body -->
  <ellipse cx="240" cy="230" rx="130" ry="72" fill="#dedad0"/>
  <!-- neck + head -->
  <path d="M330 190 L400 110 L440 120 L448 152 L420 168 L388 220 Z" fill="#dedad0"/>
  <rect x="404" y="96" width="70" height="44" rx="14" transform="rotate(18 440 118)" fill="#dedad0"/>
  <circle cx="452" cy="128" r="7" fill="#1d1410"/>
  <path d="M414 92 l10 -26 l12 22 Z" fill="#dedad0"/>
  <path d="M436 96 l10 -26 l12 22 Z" fill="#dedad0"/>
