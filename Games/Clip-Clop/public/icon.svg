    <line x1="180" y1="288" x2="176" y2="352"/>
    <line x1="300" y1="288" x2="304" y2="352"/>
  </g>
  <rect x="160" y="316" width="34" height="16" rx="8" fill="#e66900" transform="rotate(-3 177 324)"/>
  <rect x="284" y="316" width="34" height="16" rx="8" fill="#00b04d" transform="rotate(3 301 324)"/>
  <!-- saddle -->
  <rect x="196" y="168" width="88" height="26" rx="12" fill="#8c3b2e"/>
</svg>
