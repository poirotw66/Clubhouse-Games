<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>海灣帆航｜Clubhouse Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="gl" aria-label="帆船遊戲畫面"></canvas>

    <div id="boot-error" class="boot-error" hidden></div>

    <div id="title-overlay" class="title-overlay">
      <img src="./title-logo.svg" alt="" width="120" height="120" class="title-logo" />
      <h1 class="title-brand">海灣帆航</h1>
      <p class="title-tag">依風勢調帆，繞過浮標完成賽程</p>
      <button type="button" id="btn-start" class="btn primary">開始航行</button>
      <p class="title-hint">← → 轉舵 · Q / E 調帆 · T 自動調帆</p>
    </div>

    <header class="top-bar">
      <div class="brand-chip">
        <img src="./title-logo.svg" alt="" width="36" height="36" />
        <span>海灣帆航</span>
      </div>
      <div class="hud-stats">
        <div class="stat"><span class="label">航速</span><span id="hud-speed">0.0 kn</span></div>
        <div class="stat"><span class="label">真風</span><span id="hud-wind">—</span></div>
        <div class="stat"><span class="label">航向</span><span id="hud-point">—</span></div>
        <div class="stat"><span class="label">帆角</span><span id="hud-trim">—</span></div>
      </div>
      <div class="top-actions">
        <button type="button" id="btn-autotrim" class="btn ghost active" aria-pressed="true">自動調帆</button>
        <button type="button" id="btn-help" class="btn ghost">說明</button>
        <button type="button" id="btn-restart" class="btn ghost">重開</button>
      </div>
    </header>

    <aside class="race-panel" aria-live="polite">
      <div class="stat"><span class="label">目標</span><span id="hud-mark">—</span></div>
      <div class="stat"><span class="label">時間</span><span id="hud-time">0:00.0</span></div>
      <div class="stat"><span class="label">最佳</span><span id="hud-best">—</span></div>
    </aside>

    <div class="wind-rose" title="相對風向（上方為船首）">
      <div class="rose-ring">
        <span class="rose-n">船首</span>
        <div id="wind-needle" class="wind-needle"></div>
      </div>
      <span class="rose-label">相對風</span>
    </div>

    <div class="touch-pad" aria-hidden="true">
      <div class="pad left">
        <button type="button" class="touch-btn" data-hold="rudderLeft">左轉</button>
        <button type="button" class="touch-btn" data-hold="rudderRight">右轉</button>
      </div>
      <div class="pad right">
        <button type="button" class="touch-btn" data-hold="trimIn">收帆</button>
        <button type="button" class="touch-btn" data-hold="trimOut">放帆</button>
      </div>
    </div>

    <div id="help-panel" class="panel" hidden>
      <h2>操作說明</h2>
      <ul>
        <li><kbd>←</kbd> <kbd>→</kbd> 或 <kbd>A</kbd> <kbd>D</kbd>：轉舵</li>
        <li><kbd>Q</kbd> / <kbd>E</kbd>：收帆／放帆（關閉自動調帆時）</li>
        <li><kbd>T</kbd>：切換自動調帆</li>
        <li>拖曳畫面：環顧左右</li>
        <li><kbd>R</kbd>：重新開始</li>
      </ul>
      <p>頂風約 38° 內無法產生前進推力（頂風區）。繞過橙白浮標（左舷），依序通過頂標 → 橫標 → 尾標即完賽。</p>
      <button type="button" id="btn-help-close" class="btn primary">關閉</button>
    </div>

    <div id="finish-panel" class="panel finish" hidden>
      <h2>完賽！</h2>
      <p>成績 <strong id="finish-time">—</strong></p>
      <p>最佳 <strong id="finish-best">—</strong></p>
      <button type="button" id="btn-finish-restart" class="btn primary">再航一趟</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
