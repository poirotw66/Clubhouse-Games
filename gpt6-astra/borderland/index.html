<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DUST RIOT — 荒土暴動</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1a1520;
font-family:"Segoe UI","Microsoft JhengHei",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;display:none;z-index:2}
.top{position:absolute;top:max(12px,env(safe-area-inset-top));left:16px}
.brand{font-size:clamp(18px,4vw,28px);font-weight:1000;font-style:italic;color:#ffdc61;
text-shadow:3px 3px #17131c;letter-spacing:2px}
.sub{font-size:10px;letter-spacing:3px;color:#e5caa5;margin-top:4px}
#wave{position:absolute;right:16px;top:max(14px,env(safe-area-inset-top));text-align:right;
font-weight:bold;font-size:clamp(13px,3.5vw,18px);text-shadow:2px 2px #000}
.bottom{position:absolute;left:16px;bottom:max(16px,env(safe-area-inset-bottom));width:min(270px,55vw)}
.label{font-size:11px;font-weight:bold;letter-spacing:2px}
.bar{height:18px;background:#211b25;border:3px solid #201822;
transform:skew(-12deg);margin:7px 0;box-shadow:3px 3px #0006}
#health{height:100%;background:#ff654b;width:100%;transition:width .15s}
#stats{font-size:11px;color:#fff1cf}
#ammo{position:absolute;right:16px;bottom:max(16px,env(safe-area-inset-bottom));text-align:right;
font-size:clamp(28px,8vw,48px);font-weight:1000;text-shadow:3px 3px #201822}
#ammo small{font-size:clamp(12px,3vw,18px);color:#f4cf79}
#weapon{font-size:10px;letter-spacing:2px;color:#f4cf79;max-width:42vw}
#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%)}
#cross:before,#cross:after{content:"";position:absolute;background:#ffedbb;box-shadow:0 0 2px #000}
#cross:before{width:2px;height:22px;left:10px}
#cross:after{height:2px;width:22px;top:10px}
#hit{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
font-size:42px;color:#ffdd53;opacity:0}
#notice{position:absolute;top:22%;width:100%;text-align:center;padding:0 12px;
font-size:clamp(16px,5vw,28px);font-weight:1000;color:#ffdf68;text-shadow:3px 3px #261b23}
#damage{position:absolute;inset:0;box-shadow:inset 0 0 160px 50px #f32619;opacity:0}
#controls{position:absolute;bottom:max(4px,env(safe-area-inset-bottom));width:100%;text-align:center;
font-size:10px;color:#ffefc180;padding:0 8px}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
background:linear-gradient(110deg,#17111ee8,#35202a99);color:#fff;z-index:5;pointer-events:auto;
overflow:auto;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
.panel{max-width:720px;width:min(720px,94vw);padding:28px 28px;border-left:8px solid #ffce48;
background:#201922e8;box-shadow:14px 14px 0 #0005;transform:skew(-2deg);max-height:92vh;overflow:auto}
.tag{color:#ffce48;letter-spacing:5px;font-size:11px;font-weight:bold}
.panel h1{font-size:clamp(32px,8vw,72px);line-height:.9;margin:14px 0 10px;color:#ffd653;
font-weight:1000;font-style:italic;text-shadow:5px 5px #bd563a}
.panel h2{margin:0 0 12px;letter-spacing:6px;font-size:clamp(14px,3.5vw,18px)}
.panel p{color:#d5c7bd;line-height:1.65;font-size:13px;margin:8px 0}
.panel button,.actions button{border:3px solid #171119;background:#ffcf49;color:#201922;
padding:12px 18px;font-size:15px;font-weight:1000;cursor:pointer;
box-shadow:5px 5px 0 #b14d31;margin:6px 8px 6px 0;pointer-events:auto;touch-action:manipulation}
.panel button:hover,.actions button:hover{background:#fff1a2}
.panel button.secondary{background:#3a3038;color:#ffe7b0;box-shadow:5px 5px 0 #1a1418}
.panel button.ghost{background:transparent;color:#ffd653;box-shadow:none}
.panel button.mode,.panel button.weapon{display:block;width:100%;text-align:left;background:#2a222c;color:#ffe7b0;
box-shadow:3px 3px 0 #120e14;margin:8px 0;padding:12px 14px;transform:skew(0)}
.panel button.mode.active,.panel button.weapon.active{background:#ffcf49;color:#201922}
.panel button.mode small,.panel button.weapon small{display:block;font-weight:600;opacity:.85;margin-top:4px;font-size:12px}
.section-label{font-size:11px;letter-spacing:3px;color:#e7b890;margin:14px 0 4px;font-weight:700}
.badge{display:inline-block;padding:4px 10px;margin:0 6px 6px 0;background:#ffcf49;color:#201922;
font-size:12px;font-weight:900;letter-spacing:1px}
.badge.gold{background:#ff8f5a}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.result-grid div{background:#2a222c;padding:10px 12px}
.result-grid small{display:block;color:#e7b890;font-size:11px;letter-spacing:1px}
.result-grid b{font-size:20px}
.result-score{font-size:clamp(28px,8vw,42px);font-weight:1000;color:#ffd653;margin:8px 0}
#status{font-size:12px;color:#e7b890;margin-top:12px}
.actions{display:flex;flex-wrap:wrap;align-items:center;margin-top:8px}

/* Touch chrome */
#touchUI{position:fixed;inset:0;z-index:4;pointer-events:none;display:none}
#touchUI.show{display:block}
.stick-zone{position:absolute;width:42vw;max-width:200px;height:42vw;max-height:200px;
bottom:max(12px,env(safe-area-inset-bottom));pointer-events:auto;touch-action:none}
#moveStick{left:max(8px,env(safe-area-inset-left))}
#lookStick{right:max(8px,env(safe-area-inset-right))}
.stick-base{position:absolute;inset:18%;border-radius:50%;
background:#1a142299;border:2px solid #ffcf4988}
.stick-knob{position:absolute;width:38%;height:38%;left:50%;top:50%;
border-radius:50%;background:#ffcf49cc;border:2px solid #fff3b0;
transform:translate(-50%,-50%);pointer-events:none}
#lookStick{bottom:max(12px,env(safe-area-inset-bottom));right:max(8px,env(safe-area-inset-right))}
#touchBtns{position:absolute;right:max(14px,env(safe-area-inset-right));
bottom:max(calc(38vw + 24px), 220px);
display:flex;flex-direction:column;gap:10px;pointer-events:none;align-items:flex-end}
#touchBtns button{pointer-events:auto;min-width:68px;min-height:52px;border-radius:16px;
border:2px solid #ffcf49aa;background:#2a222ce6;color:#ffe7b0;font-weight:900;
font-size:13px;touch-action:manipulation;letter-spacing:1px}
#touchBtns button.fire{min-width:78px;min-height:78px;border-radius:50%;
background:#ff654bcc;border-color:#ffedbb;color:#fff;font-size:15px}
#touchBtns button:active,#touchBtns button.held{background:#ffcf49;color:#201922}
#pauseBtn{position:absolute;top:max(10px,env(safe-area-inset-top));right:50%;
transform:translateX(50%);pointer-events:auto;min-width:64px;min-height:40px;
border-radius:12px;border:2px solid #ffcf4988;background:#201922cc;color:#ffe7b0;
font-weight:800;font-size:12px;touch-action:manipulation;display:none}
#pauseBtn.show{display:block}
@media(max-width:720px){
  .bottom{bottom:max(150px,calc(env(safe-area-inset-bottom) + 140px));width:min(220px,48vw)}
  #ammo{bottom:max(150px,calc(env(safe-area-inset-bottom) + 140px))}
  #controls{display:none}
  #cross{opacity:.55}
  .stick-zone{width:36vw;max-width:160px;height:36vw;max-height:160px}
}
</style>
</head>
<body>
<div id="hud">
  <div class="top"><div class="brand">DUST RIOT</div><div class="sub" id="modeSub">WASTELAND SURVIVAL</div></div>
  <div id="wave"></div>
  <div class="bottom">
    <div class="label">VITALS // 生命值 <span id="hpText">100</span></div>
    <div class="bar"><div id="health"></div></div>
    <div id="stats"></div>
  </div>
  <div id="ammo"><span id="rounds">24</span><small> / ∞</small><div id="weapon">SCRAP-RIFLE // MK.04</div></div>
  <div id="cross"></div><div id="hit">×</div>
  <div id="notice"></div><div id="damage"></div>
  <div id="controls">WASD 移動 · SHIFT 奔跑 · SPACE 跳躍 · R 換彈 · ESC 暫停 · 滑鼠瞄準射擊</div>
</div>
<button type="button" id="pauseBtn">暫停</button>
<div id="touchUI" aria-label="觸控操作">
  <div class="stick-zone" id="moveStick">
    <div class="stick-base"></div>
    <div class="stick-knob" id="moveKnob"></div>
  </div>
  <div class="stick-zone" id="lookStick">
    <div class="stick-base"></div>
    <div class="stick-knob" id="lookKnob"></div>
  </div>
  <div id="touchBtns">
    <button type="button" id="btnJump">跳</button>
    <button type="button" id="btnReload">換彈</button>
    <button type="button" class="fire" id="btnFire">開火</button>
  </div>
</div>
<div id="overlay">
  <div class="panel" id="panel"></div>
</div>
<script type="module">
import * as THREE from "../vendor/three/build/three.module.min.js";
import {
  DIFFICULTIES,
  DIFFICULTY_ORDER,
  WEAPONS,
  WEAPON_ORDER,
  ENEMY_KINDS,
  STORAGE_KEY,
  LEGACY_STORAGE_KEY,
  enemyFireCooldown,
  enemyHp,
  enemySpeed,
  endReasonLabel,
  getDifficulty,
  getWeapon,
  getEnemyKind,
  killScore,
  migrateStats,
  pickWaveComposition,
  projectileSpeed,
  reachedClearWave,
  recordRun,
  shieldBlocksHit,
  spawnCount,
  weaponHitDamage,
  isEliteWave,
} from "./rules.mjs";
import {
  playCapture,
  playGoal,
  playHeadshot,
  playHurt,
  playImpact,
  playLose,
  playReload,
  playScore,
  playShoot,
  playWave,
  playWin,
} from "../shared/sfx.mjs";

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
/** Force touch chrome via ?touch=1 (Playwright / QA). */
const isTouch =
  params.has("touch") ||
  matchMedia("(pointer:coarse)").matches ||
  matchMedia("(hover:none) and (max-width: 900px)").matches ||
  ("ontouchstart" in window && Math.min(innerWidth, innerHeight) < 900);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe5b681);
scene.fog = new THREE.Fog(0xe5b681, 35, 115);

const camera = new THREE.PerspectiveCamera(76, innerWidth / innerHeight, .08, 180);
camera.rotation.order = "YXZ";
scene.add(camera);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = !isTouch;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffe6b3, 0x695060, 2.3));
const sun = new THREE.DirectionalLight(0xffedd0, 3);
sun.position.set(-24, 45, 18);
sun.castShadow = !isTouch;
if (!isTouch) {
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left:-48, right:48, top:48, bottom:-48, far:130 });
  sun.shadow.normalBias = .04;
}
scene.add(sun);

const bands = new THREE.DataTexture(new Uint8Array([
  65,65,65,255, 150,150,150,255, 255,255,255,255
]),3,1,THREE.RGBAFormat);
bands.minFilter = bands.magFilter = THREE.NearestFilter;
bands.needsUpdate = true;
const mats = {};
function mat(color) {
  return mats[color] ||= new THREE.MeshToonMaterial({ color, gradientMap:bands });
}
const ink = new THREE.MeshBasicMaterial({ color:0x241d29, side:THREE.BackSide });
const boxGeo = new THREE.BoxGeometry(1,1,1);
const sphereGeo = new THREE.IcosahedronGeometry(1,0);

function mesh(geo, color, scale, pos, parent=scene, outline=true) {
  const m = new THREE.Mesh(geo, mat(color));
  m.scale.set(...scale);
  m.position.set(...pos);
  m.castShadow = m.receiveShadow = !isTouch;
  parent.add(m);
  if (outline) {
    const edge = new THREE.Mesh(geo, ink);
    edge.scale.setScalar(1.045);
    m.add(edge);
  }
  return m;
}
function box(color, scale, pos, parent=scene, outline=true) {
  return mesh(boxGeo,color,scale,pos,parent,outline);
}

const ground = box(0xc78d50,[100,.5,100],[0,-.3,0],scene,false);
const obstacles = [], walls = [ground];
function building(x,z,w,h,d,color) {
  const body = box(color,[w,h,d],[x,h/2,z]);
  walls.push(body);
  obstacles.push(new THREE.Box3(
    new THREE.Vector3(x-w/2,0,z-d/2),
    new THREE.Vector3(x+w/2,h,z+d/2)
  ));
  box(0x51464a,[w+.35,.25,d+.35],[x,h+.12,z]);
  for(let i=0;i<Math.floor(w/2);i++)
    box(0x473d40,[.75,.65,.07],[x-w/2+1+i*2,h*.62,z+d/2+.05]);
  return body;
}

building(-12,-10,9,5,7,0xb46c49);
building(13,-14,8,7,8,0xba9162);
building(-15,13,8,4,7,0x888773);
building(14,12,10,5,6,0xae6346);
building(0,-24,8,3,4,0x867764);
building(-27,-2,5,8,9,0x9d6d51);
building(28,0,5,6,9,0xa77652);

const tower = new THREE.Group(); scene.add(tower); tower.position.set(13,7,-14);
mesh(new THREE.CylinderGeometry(2,2,3,10),0x617b79,[1,1,1],[0,2.6,0],tower);
for(const x of [-1.3,1.3]) for(const z of [-1.3,1.3])
  box(0x423b3c,[.15,2,.15],[x,.6,z],tower);

const signCanvas = document.createElement("canvas");
signCanvas.width=512; signCanvas.height=160;
const ctx=signCanvas.getContext("2d");
ctx.fillStyle="#e4b648";ctx.fillRect(0,0,512,160);
ctx.strokeStyle="#30262b";ctx.lineWidth=15;ctx.strokeRect(8,8,496,144);
ctx.fillStyle="#30262b";ctx.font="900 68px Arial";ctx.textAlign="center";
ctx.fillText("LAST STOP",256,87);
ctx.font="bold 24px Arial";ctx.fillText("FUEL • SCRAP • BAD IDEAS",256,125);
const sign = new THREE.Mesh(new THREE.PlaneGeometry(6,1.88),
  new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(signCanvas),side:THREE.DoubleSide}));
sign.position.set(-12,4,-6.43);scene.add(sign);

for(const [x,z] of [[-5,6],[5,-5],[7,19],[-7,-19],[-21,6],[21,-7]]) {
  building(x,z,2.3,1.7,2.1,0x697d76);
  box(0xd9a84e,[2.4,.22,2.2],[x,.55,z]);
}

for(let i=0;i<64;i++){
  const a=i/64*Math.PI*2;
  const r=46+Math.random()*5;
  const m=mesh(sphereGeo,[0xaa7959,0xb98359,0x936c56][i%3],
    [4+Math.random()*5,5+Math.random()*10,4+Math.random()*5],
    [Math.sin(a)*r,2,Math.cos(a)*r]);
  m.rotation.y=Math.random()*6;
}
for(let i=0;i<(isTouch?40:85);i++){
  const x=(Math.random()-.5)*82,z=(Math.random()-.5)*82;
  mesh(sphereGeo,0xa87c52,[.15+Math.random()*.5,.12+Math.random()*.25,.3],[x,.06,z],scene,false);
}

const gun = new THREE.Group(); camera.add(gun);
gun.position.set(.32,-.27,-.55);
const gunParts = [];
function rebuildGunVisual(weaponId) {
  while (gun.children.length) gun.remove(gun.children[0]);
  gunParts.length = 0;
  if (weaponId === "smg") {
    box(0xc9a038,[.16,.16,.55],[0,0,0],gun);
    box(0x3a3d45,[.1,.1,.5],[0,.02,-.42],gun);
    box(0x242631,[.14,.2,.18],[0,-.12,.05],gun);
    box(0xf16937,[.18,.05,.28],[0,.02,-.05],gun);
  } else if (weaponId === "shotgun") {
    box(0x8b5a2b,[.18,.16,.62],[0,0,0],gun);
    box(0x45474c,[.08,.08,.5],[.04,.02,-.4],gun);
    box(0x45474c,[.08,.08,.5],[-.04,.02,-.4],gun);
    box(0x694935,[.14,.28,.16],[0,-.16,.1],gun);
  } else {
    box(0xdab144,[.20,.20,.48],[0,0,0],gun);
    box(0x45474c,[.12,.12,.42],[0,.025,-.38],gun);
    box(0x242631,[.18,.16,.12],[0,.025,-.61],gun);
    box(0x694935,[.13,.27,.14],[.015,-.16,.08],gun);
    box(0x3c5860,[.13,.20,.18],[0,-.15,-.13],gun);
    box(0xf16937,[.215,.06,.20],[0,.02,-.10],gun);
  }
  box(0x222b35,[.045,.075,.07],[0,.14,-.16],gun);
  box(0x73edee,[.022,.025,.025],[0,.18,-.16],gun,false);
  const muzzle = new THREE.Mesh(
    new THREE.ConeGeometry(.105,.28,5),
    new THREE.MeshBasicMaterial({color:0xffdd77})
  );
  muzzle.rotation.x=-Math.PI/2;
  muzzle.position.set(0,.025,-.8);
  muzzle.name = "muzzle";
  gun.add(muzzle);muzzle.visible=false;
  gun.traverse(o=>{if(o.isMesh){o.castShadow=false;o.receiveShadow=false;}});
}
rebuildGunVisual("rifle");
function getMuzzle(){ return gun.getObjectByName("muzzle"); }
function layoutGun() {
  // Keep viewmodel off the right look-stick on phones.
  if (isTouch) gun.position.set(.18, -.32, -.58);
  else gun.position.set(.32, -.27, -.55);
}
layoutGun();

let selectedMode="normal";
let selectedWeapon="rifle";
let stats=loadStats();
let ui="menu"; // menu | playing | paused | over
const player = {pos:new THREE.Vector3(0,1.7,18), hp:100, vy:0};
let enemies=[], shots=[], effects=[], pickups=[];
let wave=0,kills=0,score=0,ammo=24,reload=0;
let fireWait=0,recoil=0,flash=0,hitTime=0,hurtTime=0,noticeTime=0,nextWave=0;
let shake=0, combo=0;
let locked=false,everLocked=false,firing=false,spaceHeld=false,won=false;
let dragLook=false, unlockPlay=false;
let yaw=0,pitch=0,elapsed=0;
const keys={};
const ray = new THREE.Raycaster();
const projectileGeo=new THREE.SphereGeometry(.16,6,4);
const projectileMat=new THREE.MeshBasicMaterial({color:0xff472a});
const lobMat=new THREE.MeshBasicMaterial({color:0xffaa33});

const touchState = {
  move: { id:null, dx:0, dy:0 },
  look: { id:null, dx:0, dy:0 },
  fire: false,
  sprint: false,
};

function loadStats() {
  let raw=null;
  try { raw=JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); } catch(e) {}
  if (!raw) {
    try { raw=JSON.parse(localStorage.getItem(LEGACY_STORAGE_KEY) || "null"); } catch(e) {}
  }
  return migrateStats(raw);
}
function saveStats() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(stats)); } catch(e) {}
}
function modeBest(mode=selectedMode) {
  return stats.bestByMode[mode] || { wave:0, score:0 };
}
function rules() {
  return getDifficulty(selectedMode);
}
function weapon() {
  return getWeapon(selectedWeapon);
}

function blocked(x,z,r=.48) {
  if(Math.hypot(x,z)>41)return true;
  return obstacles.some(b => x>b.min.x-r && x<b.max.x+r && z>b.min.z-r && z<b.max.z+r);
}
function move(pos,dx,dz,r) {
  if(!blocked(pos.x+dx,pos.z,r))pos.x+=dx;
  if(!blocked(pos.x,pos.z+dz,r))pos.z+=dz;
}
function announce(text,time=2) {
  $("notice").textContent=text;noticeTime=time;
}
function setTouchChrome(show) {
  $("touchUI").classList.toggle("show", show && isTouch);
  $("pauseBtn").classList.toggle("show", show && isTouch);
}
function updateHUD(){
  const d=rules();
  const w=weapon();
  $("health").style.width=Math.max(0, Math.min(100, player.hp / d.startingHp * 100))+"%";
  $("hpText").textContent=Math.ceil(player.hp);
  $("rounds").textContent=reload>0?"••":ammo;
  $("weapon").textContent=reload>0?"RELOADING // 換彈中":w.code;
  $("modeSub").textContent=`${d.label} · ${w.label} · 目標第 ${d.clearWave} 波`;
  $("wave").innerHTML=`波次 ${String(wave).padStart(2,"0")} / ${String(d.clearWave).padStart(2,"0")}<br><small>敵人 ${enemies.length}${isEliteWave(wave)?" · 精英":""}</small>`;
  const best=modeBest();
  $("stats").textContent=`擊殺 ${kills}　 /　 分數 ${score.toLocaleString()}　 /　 最佳波 ${best.wave}`;
}

function showOverlay(html) {
  $("panel").innerHTML=html;
  $("overlay").style.display="flex";
}
function hideOverlay() {
  $("overlay").style.display="none";
}

function modeButtonsHtml() {
  return DIFFICULTY_ORDER.map(id=>{
    const d=DIFFICULTIES[id];
    const best=stats.bestByMode[id]||{wave:0,score:0};
    const clears=stats.clearsByMode[id]||0;
    return `<button type="button" class="mode ${id===selectedMode?"active":""}" data-mode="${id}">
      <b>${d.label}</b> · 最佳波 ${best.wave} · 最高分 ${best.score.toLocaleString()} · 通關 ${clears}
      <small>${d.blurb}</small>
    </button>`;
  }).join("");
}
function weaponButtonsHtml() {
  return WEAPON_ORDER.map(id=>{
    const w=WEAPONS[id];
    const clears=stats.weaponClears?.[id]||0;
    return `<button type="button" class="weapon ${id===selectedWeapon?"active":""}" data-weapon="${id}">
      <b>${w.label}</b> · 通關 ${clears}
      <small>${w.blurb}</small>

async function requestLock() {
  if (isTouch) {
    unlockPlay = true;
    return true;
  }
  try {
    await renderer.domElement.requestPointerLock();
    return !!document.pointerLockElement;
  } catch(e) {
    unlockPlay = true;
    const status=$("status");
    if(status) status.textContent="無法鎖定滑鼠：改為拖曳畫布瞄準（或使用觸控模式）。";
    return false;
  }
}

function spawnEnemy(kind="grunt", elite=false){
  let x,z,tries=0;
  do{
    const a=Math.random()*Math.PI*2,r=24+Math.random()*13;
    x=Math.sin(a)*r;z=Math.cos(a)*r;tries++;
  }while(tries<150&&(blocked(x,z,.8)||Math.hypot(x-player.pos.x,z-player.pos.z)<16));
  if(blocked(x,z,.8)) {
    // fallback: try closer ring so waves never go empty
    for (let t=0;t<40;t++) {
      const a=Math.random()*Math.PI*2,r=18+Math.random()*8;
      x=Math.sin(a)*r;z=Math.cos(a)*r;
      if(!blocked(x,z,.8)&&Math.hypot(x-player.pos.x,z-player.pos.z)>=12) break;
    }
    if(blocked(x,z,.8)) return null;
  }
  const def=getEnemyKind(kind);
  const g=new THREE.Group();scene.add(g);g.position.set(x,0,z);
  const scale = elite ? 1.35 : 1;
  const e={
    g, kind, elite, def,
    hp:enemyHp(wave, selectedMode, kind, elite),
    speed:enemySpeed(wave, selectedMode, kind, elite),
    cooldown:1+Math.random()*2,phase:Math.random()*6,parts:[],
    shieldMesh:null,
  };
  const bodyColor = elite ? 0x7a1f3a : def.color;
  const headColor = elite ? 0xffe08a : def.headColor;
  const body=box(bodyColor,[.85*scale,.95*scale,.52*scale],[0,1.3*scale,0],g);
  const head=box(headColor,[.55*scale,.52*scale,.50*scale],[0,2.05*scale,0],g);
  box(0x282b35,[.44*scale,.13*scale,.05*scale],[0,2.08*scale,.275*scale],g);
  box(0xff492d,[.27*scale,.055*scale,.055*scale],[0,2.09*scale,.31*scale],g,false);
  for(const sx of [-.52,.52]){
    box(0x515361,[.25*scale,.75*scale,.28*scale],[sx*scale,1.25*scale,0],g);
    const leg=box(0x3a414a,[.28*scale,.73*scale,.32*scale],[sx*.48*scale,.4*scale,0],g);
    e.parts.push(leg);
  }
  if (def.shieldFront) {
    const sh=box(0x7a8894,[1.1*scale,1.4*scale,.12*scale],[0,1.35*scale,.55*scale],g);
    e.shieldMesh=sh;
  }
  if (def.lobShot) {
    box(0x3d2a40,[.4*scale,.35*scale,.55*scale],[.4*scale,1.1*scale,.2*scale],g);
  }
  if (def.meleeOnly) {
    box(0xc45a2a,[.15*scale,.15*scale,.7*scale],[.6*scale,1.2*scale,.3*scale],g);
  } else if (!def.shieldFront) {
    box(0x292e38,[.23*scale,.23*scale,.7*scale],[.55*scale,1.13*scale,.35*scale],g);
  }
  if (elite) {
    box(0xffce48,[.3*scale,.08*scale,.3*scale],[0,2.45*scale,0],g,false);
  }
  g.traverse(o=>{
    if(o.isMesh && o.material!==ink){
      o.userData.enemy=e;o.userData.head=o===head;
      o.userData.shield=o===e.shieldMesh;
    }
  });
  enemies.push(e);
  return e;
}
function beginWave(){
  wave++;
  const n=spawnCount(wave, selectedMode);
  const comp=pickWaveComposition(wave, n);
  let spawned=0;
  for(const slot of comp){
    if(spawnEnemy(slot.kind, slot.elite)) spawned++;
  }
  // guarantee at least one enemy
  while(spawned===0 && enemies.length===0){
    if(spawnEnemy("grunt", false)) spawned++;
    else break;
  }
  const d=rules();
  const eliteTag=isEliteWave(wave)?" · 精英波":"";
  announce(`第 ${wave} 波 // 目標 ${d.clearWave}${eliteTag}`,2.8);
  playWave();
  updateHUD();
}
function addPickup(pos){
  const g=new THREE.Group();g.position.set(pos.x,.6,pos.z);scene.add(g);
  box(0x51cf92,[.6,.45,.6],[0,0,0],g);
  box(0xf3fff0,[.36,.09,.025],[0,0,.315],g,false);
  box(0xf3fff0,[.09,.30,.025],[0,0,.32],g,false);
  pickups.push({g,time:28});
}
function particles(pos,color,n=7){
  for(let i=0;i<n;i++){
    const m=new THREE.Mesh(boxGeo,mat(color));
    m.scale.setScalar(.055+Math.random()*.09);m.position.copy(pos);scene.add(m);
    effects.push({m,time:.35,vel:new THREE.Vector3(
      (Math.random()-.5)*5,Math.random()*4,(Math.random()-.5)*5
    )});
  }
}
function damageEnemy(e,amount,point,{headshot=false,blocked=false}={}){
  if(blocked){
    particles(point,0xa0b0c0,4);
    playImpact(0.25);
    hitTime=.08;
    return;
  }
  e.hp-=amount;hitTime=.12;particles(point,headshot?0xfff1a0:0xffc44f,headshot?10:7);
  if(headshot){ playHeadshot(); combo=Math.min(8,combo+1); }
  else { playCapture(); combo=Math.max(0,combo-1); }
  shake=Math.min(0.18, shake+(headshot?0.06:0.03));
  if(e.hp<=0){
    scene.remove(e.g);
    enemies=enemies.filter(a=>a!==e);
    kills++;score+=killScore(wave, e.kind, e.elite);
    playScore();
    if(Math.random()<.45)addPickup(e.g.position);
    particles(e.g.position.clone().add(new THREE.Vector3(0,1,0)),0xb84730,12);
    if(e.elite){ announce("精英擊破！",1.2); playGoal(); }
  }
  updateHUD();
}
function startReload(){
  const w=weapon();
  if(reload>0||ammo===w.magSize||ui!=="playing")return;
  reload=w.reloadSec;playReload();updateHUD();
}
function shootRay(spreadYaw, spreadPitch){
  const w=weapon();
  camera.updateMatrixWorld(true);
  const dir=new THREE.Vector3(0,0,-1);
  dir.applyQuaternion(camera.quaternion);
  // apply spread in camera local space
  const right=new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
  const up=new THREE.Vector3(0,1,0).applyQuaternion(camera.quaternion);
  dir.addScaledVector(right, spreadYaw).addScaledVector(up, spreadPitch).normalize();
  ray.set(camera.getWorldPosition(new THREE.Vector3()), dir);
  const hits=ray.intersectObjects([...enemies.map(e=>e.g),...walls],true)
    .filter(h=>h.object.material!==ink);
  let end=ray.ray.at(w.range,new THREE.Vector3());
  if(hits.length){
    const h=hits[0];end=h.point;
    const dist=h.distance;
    if(h.object.userData.enemy){
      const enemy=h.object.userData.enemy;
      const {damage,inRange}=weaponHitDamage(selectedWeapon, dist, !!h.object.userData.head);
      if(!inRange || damage<=0){
        particles(end,0xffdaa0,2);
      } else {
        let blocked=false;
        if(enemy.def.shieldFront && !h.object.userData.head){
          blocked=shieldBlocksHit(
            enemy.g.rotation.y,
            camera.position.x, camera.position.z,
            enemy.g.position.x, enemy.g.position.z,
            selectedWeapon
          );
          // hitting the shield mesh itself always blocks unless shotgun close flank already passed
          if(h.object.userData.shield) blocked=true;
          // shotgun within 10u can punch through with reduced chance when not dead-front
          if(selectedWeapon==="shotgun" && dist<10 && !h.object.userData.shield){
            const dx=camera.position.x-enemy.g.position.x;
            const dz=camera.position.z-enemy.g.position.z;
            const len=Math.hypot(dx,dz)||1;
            const fx=Math.sin(enemy.g.rotation.y), fz=Math.cos(enemy.g.rotation.y);
            const dot=(dx/len)*fx+(dz/len)*fz;
            if(dot<0.55) blocked=false;
          }
        }
        damageEnemy(enemy, damage, end, {
          headshot:!!h.object.userData.head && !blocked,
          blocked,
        });
      }
    } else {
      particles(end,0xffdaa0,3);
    }
  }
  const origin=new THREE.Vector3(0,.025,-.8);
  gun.localToWorld(origin);
  const geo=new THREE.BufferGeometry().setFromPoints([origin,end]);
  const line=new THREE.Line(geo,new THREE.LineBasicMaterial({
    color: selectedWeapon==="shotgun"?0xffb070:0xffe8a5
  }));
  scene.add(line);effects.push({m:line,time:.04,dispose:true});
}
function shoot(){
  const w=weapon();
  if(fireWait>0||reload>0||ui!=="playing")return;
  if(ammo<=0){startReload();return;}
  ammo--;fireWait=w.fireCooldown;
  recoil=Math.min(recoil+w.recoilKick,w.recoilCap);flash=.045;
  playShoot(selectedWeapon==="smg"?1:selectedWeapon==="shotgun"?-1:0);
  shake=Math.min(0.12, shake+0.02);
  for(let i=0;i<w.pellets;i++){
    const sy=(Math.random()-.5)*w.spread*2;
    const sp=(Math.random()-.5)*w.spread*2;
    shootRay(sy, sp);
  }
  updateHUD();
}

document.addEventListener("pointerlockchange",()=>{

    $("hud").style.display="block";

      everLocked=true;

      // Only auto-pause when the player *exits* an active lock (Esc / focus loss).

  firing=false;
  Object.keys(keys).forEach(k=>delete keys[k]);

});

function bindStick(zoneEl, knobEl, stateKey, opts={}) {
  const sens = opts.look ? 1 : 1;
  zoneEl.addEventListener("pointerdown", e=>{
    if(ui!=="playing") return;
    e.preventDefault();
    zoneEl.setPointerCapture(e.pointerId);
    touchState[stateKey].id=e.pointerId;
    updateStick(e, zoneEl, knobEl, stateKey, sens, opts);
  });
  zoneEl.addEventListener("pointermove", e=>{
    if(touchState[stateKey].id!==e.pointerId) return;
    e.preventDefault();
    updateStick(e, zoneEl, knobEl, stateKey, sens, opts);
  });
  const end=e=>{
    if(touchState[stateKey].id!==e.pointerId) return;
    touchState[stateKey].id=null;
    touchState[stateKey].dx=0;
    touchState[stateKey].dy=0;
    knobEl.style.transform="translate(-50%,-50%)";
  };
  zoneEl.addEventListener("pointerup", end);
  zoneEl.addEventListener("pointercancel", end);
}
function updateStick(e, zoneEl, knobEl, stateKey, sens, opts) {
  const rect=zoneEl.getBoundingClientRect();
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  let dx=e.clientX-cx, dy=e.clientY-cy;
  const maxR=rect.width*0.32;
  const len=Math.hypot(dx,dy)||1;
  if(len>maxR){ dx=dx/len*maxR; dy=dy/len*maxR; }
  knobEl.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  const nx=dx/maxR, ny=dy/maxR;
  if(opts.look){
    // look stick: continuous yaw/pitch rate
    touchState.look.dx = nx * sens;
    touchState.look.dy = ny * sens;
  } else {
    touchState.move.dx = nx;
    touchState.move.dy = ny;
    touchState.sprint = Math.hypot(nx,ny) > 0.85;
  }
}
bindStick($("moveStick"), $("moveKnob"), "move");
bindStick($("lookStick"), $("lookKnob"), "look", { look:true });

function bindHold(btn, onDown, onUp) {

  btn.addEventListener("pointerdown", down);
  btn.addEventListener("pointerup", up);
  btn.addEventListener("pointercancel", up);
  btn.addEventListener("pointerleave", up);
}

function update(dt){
  elapsed+=dt;
  fireWait=Math.max(0,fireWait-dt);
  flash=Math.max(0,flash-dt);
  shake=Math.max(0,shake-dt*1.8);
  recoil=THREE.MathUtils.damp(recoil,0,14,dt);
  const w=weapon();
  if(reload>0){
    reload-=dt;
    if(reload<=0){reload=0;ammo=w.magSize;updateHUD();}
  }

  // look from touch stick
  if(isTouch && ui==="playing"){
    yaw -= touchState.look.dx * 2.4 * dt;
    pitch = THREE.MathUtils.clamp(pitch - touchState.look.dy * 2.0 * dt, -1.4, 1.4);
  }

  let right=(keys.KeyD?1:0)-(keys.KeyA?1:0);
  let forward=(keys.KeyW?1:0)-(keys.KeyS?1:0);
  if(isTouch){
    right += touchState.move.dx;
    forward += -touchState.move.dy;
  }
  const len=Math.hypot(right,forward);
  if(len){right/=len;forward/=len;}
  const sprinting = keys.ShiftLeft||keys.ShiftRight||touchState.sprint;
  const speed=(sprinting?9:5.8)*dt;
  move(player.pos,
    (Math.cos(yaw)*right-Math.sin(yaw)*forward)*speed,
    (-Math.sin(yaw)*right-Math.cos(yaw)*forward)*speed,.45);
  player.vy-=17*dt;player.pos.y+=player.vy*dt;
  if(player.pos.y<1.7){player.pos.y=1.7;player.vy=0;}
  camera.position.copy(player.pos);
  if(len&&player.pos.y<=1.7)camera.position.y+=Math.sin(elapsed*13)*.035;
  if(shake>0){
    camera.position.x += (Math.random()-.5)*shake*0.55;
    camera.position.y += (Math.random()-.5)*shake*0.35;
  }
  camera.rotation.set(pitch+recoil*.17,yaw,0);
  const gx = isTouch ? .18 : .32;
  const gy = isTouch ? -.32 : -.27;
  const gz = isTouch ? -.58 : -.55;
  gun.position.set(gx+(len?Math.sin(elapsed*8)*.012:0),gy-recoil*.25,gz+recoil);
  gun.rotation.x=reload>0?-.65*Math.sin(reload/w.reloadSec*Math.PI):0;
  const muzzle=getMuzzle();
  if(muzzle) muzzle.visible=flash>0;
  if(firing || touchState.fire)shoot();

  const d=rules();
  for(const e of enemies){
    const dx=player.pos.x-e.g.position.x,dz=player.pos.z-e.g.position.z;
    const dist=Math.hypot(dx,dz);
    e.g.rotation.y=Math.atan2(dx,dz);
    const prefer = e.def.preferRange;
    if(e.def.meleeOnly){
      if(dist>1.2){
        const sx=dx/Math.max(dist,.01),sz=dz/Math.max(dist,.01);
        move(e.g.position,sx*e.speed*1.15*dt,sz*e.speed*1.15*dt,.65);
      }
    } else if(e.def.lobShot){
      // keep distance — back off if too close, approach if too far
      if(dist < prefer-3){
        const sx=-dx/Math.max(dist,.01),sz=-dz/Math.max(dist,.01);
        move(e.g.position,sx*e.speed*dt,sz*e.speed*dt,.65);
      } else if(dist > prefer+2){
        const sx=dx/Math.max(dist,.01),sz=dz/Math.max(dist,.01);
        move(e.g.position,sx*e.speed*dt,sz*e.speed*dt,.65);
      }
    } else {
      if(dist>prefer){
        const sx=dx/Math.max(dist,.01),sz=dz/Math.max(dist,.01);
        const strafe=Math.sin(elapsed*.8+e.phase)*.55;
        move(e.g.position,(sx+sz*strafe)*e.speed*dt,(sz-sx*strafe)*e.speed*dt,.65);
      }
    }
    e.parts.forEach((leg,i)=>leg.rotation.x=Math.sin(elapsed*(e.def.meleeOnly?12:8)+i*Math.PI+e.phase)*.32);
    e.cooldown-=dt;
    if(e.cooldown<=0){
      e.cooldown=enemyFireCooldown(wave, selectedMode, e.kind)+Math.random()*.6;
      if(e.def.meleeOnly){
        if(dist<1.8) hurt(d.enemyDamage * e.def.damageMult);
      } else if(e.def.canShoot && dist<40){
        const origin=e.g.position.clone().add(new THREE.Vector3(0,1.45*(e.elite?1.2:1),0));
        if(e.def.lobShot){
          // arcing shell — slow projectile with gravity, slight lead
          const target=player.pos.clone();
          target.x += (Math.random()-.5)*2.5;
          target.z += (Math.random()-.5)*2.5;
          const m=new THREE.Mesh(projectileGeo,lobMat);
          m.scale.setScalar(1.4);
          m.position.copy(origin);scene.add(m);
          const to=target.clone().sub(origin);
          const flight=Math.max(0.9, to.length()/10);
          const vel=to.divideScalar(flight);
          vel.y = (target.y - origin.y)/flight + 0.5*9*flight;
          shots.push({m,vel,life:flight+0.8,lob:true,damage:d.enemyDamage*e.def.damageMult,blast:2.2});
        } else {
          const dir=player.pos.clone().sub(origin).normalize();
          ray.set(origin,dir);
          const obstruction=ray.intersectObjects(walls,false)[0];
          if(!obstruction||obstruction.distance>origin.distanceTo(player.pos)){
            const m=new THREE.Mesh(projectileGeo,projectileMat);
            m.position.copy(origin);scene.add(m);
            const spd=projectileSpeed(wave, selectedMode)*(e.elite?1.15:1);
            shots.push({m,vel:dir.multiplyScalar(spd),life:5,lob:false,damage:d.enemyDamage*e.def.damageMult});
          }
        }
      }
    }
  }
  for(let i=shots.length-1;i>=0;i--){
    const s=shots[i];
    if(s.lob) s.vel.y -= 9*dt;
    const step=s.vel.clone().multiplyScalar(dt);
    ray.set(s.m.position,step.clone().normalize());
    const wall=ray.intersectObjects(walls,false)[0];
    const end=s.m.position.clone().add(step);
    const segment=new THREE.Line3(s.m.position,end);
    const nearest=segment.closestPointToPoint(player.pos,true,new THREE.Vector3());
    let hitPlayer=nearest.distanceTo(player.pos)<.55;
    if(s.lob && end.y < 0.3){
      // ground impact blast
      const blastDist=Math.hypot(end.x-player.pos.x, end.z-player.pos.z);
      if(blastDist < (s.blast||2)) hitPlayer=true;
      particles(end,0xffaa33,10);
      playImpact(0.7);
      scene.remove(s.m);shots.splice(i,1);
      if(hitPlayer) hurt(s.damage||d.enemyDamage);
      continue;
    }
    s.life-=dt;
    const hitWall=wall&&wall.distance<=step.length();
    if(hitPlayer&&!hitWall)hurt(s.damage||d.enemyDamage);
    s.m.position.copy(end);
    if(s.life<=0||hitPlayer||hitWall){
      if(s.lob && hitWall) particles(end,0xffaa33,6);
      scene.remove(s.m);shots.splice(i,1);
    }
  }
  for(let i=effects.length-1;i>=0;i--){
    const e=effects[i];e.time-=dt;
    if(e.vel){e.m.position.addScaledVector(e.vel,dt);e.vel.y-=9*dt;}
    if(e.time<=0){removeEffect(e);effects.splice(i,1);}
  }
  for(let i=pickups.length-1;i>=0;i--){
    const p=pickups[i];p.time-=dt;p.g.rotation.y+=dt*2;
    p.g.position.y=.65+Math.sin(elapsed*3)*.13;
    const near=Math.hypot(p.g.position.x-player.pos.x,p.g.position.z-player.pos.z)<1.3;
    if(near&&player.hp<d.startingHp){
      player.hp=Math.min(d.startingHp,player.hp+d.pickupHeal);
      announce(`+${d.pickupHeal} 生命值`,.8);updateHUD();
      playGoal();
      p.time=0;
    }
    if(p.time<=0){scene.remove(p.g);pickups.splice(i,1);}
  }
  hitTime=Math.max(0,hitTime-dt);hurtTime=Math.max(0,hurtTime-dt);
  $("hit").style.opacity=hitTime>0?1:0;
  $("damage").style.opacity=hurtTime*.9;
  noticeTime=Math.max(0,noticeTime-dt);
  if(noticeTime===0)$("notice").textContent="";
  if(enemies.length===0&&ui==="playing"){
    if(reachedClearWave(wave, selectedMode)){
      finishRun("victory");
      return;
    }
    if(nextWave===0){
      nextWave=3;
      player.hp=Math.min(d.startingHp,player.hp+d.betweenWaveHeal);
      announce(`區域淨空 // +${d.betweenWaveHeal} 生命值`,2.5);updateHUD();
    }else{
      nextWave-=dt;
      if(nextWave<=0){nextWave=0;beginWave();}
    }
  }
}

function canSimulate() {
  if(ui!=="playing") return false;
  return isTouch || locked || unlockPlay;
}

camera.position.copy(player.pos);
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.04);
  if(canSimulate())update(dt);
  renderer.render(scene,camera);
}
menu();
loop();

if (new URLSearchParams(location.search).has("test")) {
  Object.assign(window, {
    __dustRiotTest: {
      finishRun,
      beginRun,
      menu,
      pauseGame,
      getMode: () => selectedMode,
      setMode: (id) => { selectedMode = id; },
      getWeapon: () => selectedWeapon,
      setWeapon: (id) => { selectedWeapon = id; rebuildGunVisual(id); },
      getStats: () => structuredClone(stats),
      getWave: () => wave,
      getScore: () => score,
      getUi: () => ui,
      getEnemyKinds: () => enemies.map(e => ({ kind: e.kind, elite: e.elite })),
      isTouchMode: () => isTouch,
      enableUnlockPlay: () => { unlockPlay = true; },
      getAmmo: () => ammo,
      getPlayerHp: () => player.hp,
      /** QA helper: wipe field and start a given 1-based wave. */
      jumpToWave: (n) => {
        enemies.forEach((e) => scene.remove(e.g));
        enemies = [];
        shots.forEach((s) => scene.remove(s.m));
        shots = [];
        wave = Math.max(0, Math.floor(n) - 1);
        nextWave = 0;
        beginWave();
      },
    },
  });
}
</script>
